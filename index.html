 tbl:T(["sprechen|du sprichst, er spricht","nehmen|du nimmst, er nimmt","sehen|du siehst, er sieht","fahren|du fährst, er fährt","schlafen|du schläfst, er schläft"]),
 ex:T(["Sprichst du Englisch?|Do you speak English?","Er fährt mit dem Bus.|He takes the bus."]),
 g:function(){return genVerbIn(["fahren","sehen","essen","lesen","schlafen","sprechen","nehmen","geben","laufen","helfen","treffen","tragen","vergessen","wissen"])}},
{id:"a1-janein",ch:"A1-2",t:"Yes/no questions and doch",
 rule:"Yes/no questions start with the <b>verb</b>. Answer with <b>ja</b> or <b>nein</b>. To answer <i>yes</i> to a negative question, say <b>doch</b>.",
 ex:T(["Kommst du heute? – Ja.|Are you coming today? – Yes.","Hast du keine Zeit? – Doch!|Don't you have time? – Yes, I do!"]),
 items:["@Make a yes/no question: du / heute / arbeiten|Arbeitest du heute?|Du heute arbeitest?;Arbeitest heute du?;Arbeiten du heute?|The verb comes first: Arbeitest du heute?",
  "@Make a yes/no question: Sie / Kaffee / möchten|Möchten Sie Kaffee?|Möchte Sie Kaffee?;Kaffee Sie möchten?;Möchten Kaffee Sie?|Verb first, then the subject: Möchten Sie Kaffee?",
  "Hast du keine Zeit? – ___, ich habe Zeit.|Doch|Ja;Nein;Nicht|Yes to a negative question = doch.",
  "Kommst du aus Spanien? – ___, ich komme aus Italien.|Nein|Doch;Ja;Kein|The answer is no: nein.",
  "Sprichst du kein Englisch? – ___, ein bisschen.|Doch|Ja;Nein;Nicht|Yes to a negative question = doch.",
  "Wohnst du in Berlin? – ___, in Berlin.|Ja|Doch;Nein;Kein|A normal yes = ja."]},
{id:"a1-art",ch:"A1-2",t:"Articles der, das, die",

 ex:T(["der Tisch, das Buch, die Lampe|the table, the book, the lamp","die Tische, die Bücher, die Lampen|plural: always die"]),
 g:function(){return genArticle()}},
{id:"a1-plural",ch:"A1-2",t:"Plural of nouns",

 ex:T(["das Kind → die Kinder|child → children","der Apfel → die Äpfel|apple → apples"]),
 g:function(){return genPlural()}},
{id:"a1-habensein",ch:"A1-2",t:"haben and sein",
 rule:"The two most important verbs are irregular. Learn them by heart.",

 ex:T(["Ich bin Ingenieur.|I am an engineer.","Hast du Zeit?|Do you have time?"]),
 g:function(){return genVerbIn(["sein","haben"])}},
{id:"a1-ein",ch:"A1-3",t:"Indefinite article ein, eine",

{id:"a1-kein",ch:"A1-3",t:"Negation: kein and nicht",

 ex:T(["Ich habe keine Zeit.|I have no time.","Das ist nicht mein Auto.|That's not my car."]),

{id:"a1-impsie",ch:"A1-3",t:"Imperative with Sie",

{id:"a1-akk",ch:"A1-4",t:"Accusative (den, einen, keinen)",

{id:"a1-ortdat",ch:"A1-7",t:"Places: im, am, beim, zum, zur",

{id:"a1-sollen",ch:"A1-8",t:"sollen, müssen, nicht dürfen",

{id:"a1-perfekt",ch:"A1-10",t:"Perfekt (talking about the past)",
 rule:"<b>haben/sein</b> in position 2 + <b>Partizip II</b> at the end. Most verbs use <b>haben</b>. Movement or a change of state (gehen, fahren, aufstehen) and bleiben, sein, werden use <b>sein</b>. Partizip II: ge-…-t (gelernt), ge-…-en (gefahren), -ieren verbs without ge- (studiert).",
 ex:T(["Ich habe gestern Deutsch gelernt.|I studied German yesterday.","Wir sind nach Berlin gefahren.|We went to Berlin."]),
 g:function(){var r=Math.random();return r<0.4?genPerfAux():r<0.8?genPerfPart():genPerfOrder()}},

{id:"a1-man",ch:"A1-12",t:"man, denn, wer / wen / wem",

{id:"a2-genitiv",ch:"A2-1",t:"Genitive with names (Annas)",

{id:"a2-weil",ch:"A2-1",t:"Reasons with weil",
 rule:"<b>weil</b> gives a reason. The conjugated verb goes to the <b>end</b> of the weil-clause: …, weil ich in Deutschland <b>arbeite</b>. With Perfekt: …, weil ich lange gearbeitet <b>habe</b>.",
 ex:T(["Ich lerne Deutsch, weil ich in Deutschland arbeite.|I'm learning German because I work in Germany."]),
 items:["@Which sentence is correct?|Ich bleibe zu Hause, weil ich krank bin.|Ich bleibe zu Hause, weil ich bin krank.;Ich bleibe zu Hause, weil bin ich krank.;Ich bleibe zu Hause, weil krank ich bin.|weil: the verb goes to the end.",
  "@Which sentence is correct?|Er lernt Deutsch, weil er in Berlin arbeitet.|Er lernt Deutsch, weil er arbeitet in Berlin.;Er lernt Deutsch, weil arbeitet er in Berlin.;Er lernt Deutsch, weil in Berlin er arbeitet.|weil: the verb goes to the end.",
  "@Which sentence is correct?|Ich komme zu spät, weil der Bus Verspätung hat.|Ich komme zu spät, weil der Bus hat Verspätung.;Ich komme zu spät, weil hat der Bus Verspätung.;Ich komme zu spät, weil Verspätung der Bus hat.|weil: the verb goes to the end.",
  "@Which sentence is correct?|Wir gehen nicht spazieren, weil es regnet.|Wir gehen nicht spazieren, weil regnet es.;Wir gehen nicht spazieren, weil es regnen.;Wir gehen nicht spazieren, es weil regnet.|weil: the verb goes to the end.",
  "@Which sentence is correct?|Ich bin müde, weil ich lange gearbeitet habe.|Ich bin müde, weil ich habe lange gearbeitet.;Ich bin müde, weil habe ich lange gearbeitet.;Ich bin müde, weil ich lange habe gearbeitet.|Perfekt in a weil-clause: haben/sein at the very end."]},
{id:"a2-modalprt",ch:"A2-2",t:"Modal verbs in the past",

{id:"a2-possdat",ch:"A2-2",t:"Possessive articles in the dative",

{id:"a2-komp",ch:"A2-3",t:"Comparative and superlative",
 rule:"Comparative: <b>-er</b> (schnell<b>er</b>), short adjectives often with umlaut (alt → <b>ä</b>lter). Superlative: <b>am …-sten</b> (am schnellsten). Irregular: gut – besser – am besten, gern – lieber – am liebsten, viel – mehr – am meisten.",

  "@Which sentence is correct?|Wenn es regnet, bleiben wir zu Hause.|Wenn es regnet, wir bleiben zu Hause.;Wenn regnet es, bleiben wir zu Hause.;Wenn es regnet, zu Hause wir bleiben.|After the wenn-clause comes the verb."]},

function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function cap1(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function um(s){return s.replace(/(au|a|o|u)(?!.*(au|a|o|u))/,function(m){return {au:"äu",a:"ä",o:"ö",u:"ü"}[m]})}
function mk(type,sig,prompt,sub,correct,wrong,why,card){
  var w=uniq(wrong).filter(function(x){return x!==correct});
  if(w.length<3)return null;
  var opts=shuffle([correct].concat(shuffle(w).slice(0,3)));
  return{type:type,sig:sig,prompt:prompt,sub:sub,options:opts,answer:opts.indexOf(correct),why:why,card:card||null};
}

function overlap(a,b){
  var STOP={the:1,and:1,for:1,one:1,off:1,out:1,with:1,from:1,into:1,very:1,something:1,someone:1,somebody:1,"one's":1};
  function t(x){return String(x).toLowerCase().replace(/\([^)]*\)/g," ").split(/[^a-zäöüß']+/).filter(function(w){return w.length>=3&&!STOP[w]})}
  var A=t(a),B=t(b);return A.some(function(w){return B.indexOf(w)>-1});
}

function genArticle(){
  var n=pick(nounList().filter(function(x){return x.noun!=="See"}));
  var q={type:"art",sig:"art:"+n.noun,prompt:"___ "+n.noun,sub:"Which article? ("+n.en+")",options:["der","die","das"],answer:["der","die","das"].indexOf(n.art),why:n.art+" "+n.noun+" · "+n.en,card:null};
  return q;
}
function genPlural(){
  var n=pick(nounList().filter(function(x){return x.pl&&x.noun!=="Bank"&&x.noun!=="Wort"}));
  var s=n.noun,c;
  if(/e$/.test(s))c=[s,s+"s",um(s)+"n",um(s)];
  else if(/(er|el|en)$/.test(s))c=[s+"e",s+"s",um(s)+"e",um(s)];
  else c=[s+"e",s+"en",s+"er",s+"s",um(s)+"e",um(s)+"er",s];
  return mk("plural","pl:"+s,"die ___ ("+n.art+" "+s+")","Which is the plural?",n.pl,c,n.art+" "+s+" → die "+n.pl);
}

function normA(s){return String(s||"").toLowerCase().replace(/[.,!?;:"„“'’()…]/g," ").replace(/\s+/g," ").trim()}

    return{st:"ok",msg:capOk?"Correct!":"Correct! Remember: nouns start with a capital letter."};
  }
  if(foldA(a)===foldA(e))return{st:"almost",msg:"Almost: watch the umlaut or ß."};
  if(isNoun){
    var ea=e.split(" "),aa=a.split(" ");
    if(aa.length===1&&foldA(aa[0])===foldA(ea[1]))return{st:"wrong",msg:"Right word, but the article is part of it: "+expected};

function makeBuild(sentence,sub,sig,type){

function prepSVG(label,kind){
  // box = the table, ball = the object
  var bx=30,by=34,bw=40,bh=26,cx=50,cy=24,r=7;
  if(kind==="auf"){cy=by-r}else if(kind==="unter"){cy=by+bh+r+2}else if(kind==="neben"){cx=bx+bw+r+4;cy=by+bh-r}
  else if(kind==="in"){cx=50;cy=by+bh/2}else if(kind==="über"){cy=by-r-12}else if(kind==="vor"){cx=56;cy=by+bh+3;r=10}
  else if(kind==="hinter"){cx=58;cy=by-2}else if(kind==="an"){cx=bx-r;cy=by+bh/2}else if(kind==="zwischen"){cx=50;cy=by+bh-r}
  var box=kind==="zwischen"?'<rect x="14" y="'+by+'" width="24" height="'+bh+'" rx="4" fill="#A9B7D0"/><rect x="62" y="'+by+'" width="24" height="'+bh+'" rx="4" fill="#A9B7D0"/>':
    '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+(kind==="in"?"none":"#A9B7D0")+'" stroke="#7D8BA5" stroke-width="2"/>';
  var ball='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#FFC93C" stroke="#D98B00" stroke-width="1.5"/>';
  var order=kind==="hinter"?ball+box:kind==="in"?box.replace('fill="none"','fill="#A9B7D0" fill-opacity=".35"')+ball:box+ball;
  return '<div class="prep"><svg viewBox="0 0 100 80" role="img" aria-label="'+label+'">'+order+'</svg>'+label+'</div>';
}
function visHtml(id){
  var v=VIS[id];if(!v)return "";var h="";
  if(v.k==="slots"){
    var cols=v.cols.map(function(){return "1fr"}).join(" ");
    h='<div class="slots" style="--cols:'+cols+'"><div class="slot-h">'+v.cols.map(function(c){return '<span>'+esc(c)+'</span>'}).join("")+'</div>'+
      v.rows.map(function(r){return '<div class="slot-r">'+r.map(function(c,i){return '<span style="--h:'+v.h[i]+'">'+esc(c)+'</span>'}).join("")+'</div>'}).join("")+'</div>';
  }else if(v.k==="case"){
    var hot={};(v.hot||[]).forEach(function(p){hot[p[0]+":"+p[1]]=1});
    h='<table class="ctab"><tr><th class="c0"></th><th class="m">der · m</th><th class="f">die · f</th><th class="n">das · n</th><th class="p">Plural</th></tr>'+
      v.rows.map(function(r,ri){return '<tr>'+r.map(function(c,ci){return ci===0?'<td class="rh">'+esc(c)+'</td>':'<td class="'+(hot[ri+":"+ci]?'hot':'')+'">'+c+'</td>'}).join("")+'</tr>'}).join("")+'</table>';
  }else if(v.k==="pron"){
    h='<table class="ctab"><tr>'+v.cols.map(function(c,i){return '<th class="'+["m","f","n"][i%3]+'">'+esc(c)+'</th>'}).join("")+'</tr>'+v.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</table>';
  }else if(v.k==="prep"){
    h='<div class="preps">'+["auf","unter","neben","in","über","vor","hinter","an","zwischen"].map(function(k){return prepSVG(k,k)}).join("")+'</div>';
  }else if(v.k==="time"){
    var col={past:"#8B5CF6",now:"var(--accent)",future:"var(--good)"};
    h='<div class="tline">'+v.pts.map(function(p){return '<span class="pt" style="left:'+p[2]+'%;color:'+col[p[1]]+'">'+esc(p[0])+'<i></i></span>'}).join("")+'<div class="ax"></div>'+
      '<div class="ex">'+v.ex.map(function(e,i){return e?'<div>'+esc(e)+'</div>':'<div style="opacity:.4">'+["Past","Now","Future"][i]+'</div>'}).join("")+'</div></div>';
  }else if(v.k==="bars"){
    h='<div class="bars">'+v.items.map(function(b){return '<div style="height:'+b[1]+'%;background:linear-gradient(180deg,hsl('+b[2]+' 80% 62%),hsl('+b[2]+' 70% 48%))">'+esc(b[0])+'</div>'}).join("")+'</div>';
  }else if(v.k==="icons"){
    h='<div class="icons4">'+v.items.map(function(b){return '<div><b>'+b[0]+'</b><span>'+esc(b[1])+'<em>'+esc(b[2])+'</em></span></div>'}).join("")+'</div>';
  }
  return '<div class="vis"><h4>'+esc(v.t||"At a glance")+'</h4>'+h+'</div>';
}

var GTERMS={
 verb:["Verb","das Verb","A word for an action or a state: what someone does or is.","lernen, gehen, sein, haben"],
 infinitive:["Infinitive","der Infinitiv","The basic form of a verb, as in the dictionary. In German it almost always ends in -en (or -n).","machen, fahren, sein"],
 conjugation:["Conjugation","die Konjugation","Changing the verb so it fits the person: ich lern<b>e</b>, du lern<b>st</b>, er lern<b>t</b>. The front part stays, the ending changes.","ich komme, du kommst, sie kommt"],
 stem:["Verb stem","der Verbstamm","The infinitive without -en. You add the endings to the stem.","lern-en → stem: lern"],
 subject:["Subject","das Subjekt","The person or thing that does the action. Ask: Wer? or Was? It is always in the nominative.","<b>Der Hund</b> schläft. <b>Ich</b> lerne."],
 object:["Object","das Objekt","The person or thing the action is done to. A direct object is in the accusative (Wen? Was?), an indirect object in the dative (Wem?).","Ich kaufe <b>einen Apfel</b>. Ich gebe <b>dir</b> das Buch."],
 noun:["Noun","das Nomen","A word for a person, thing, place or idea. In German every noun starts with a capital letter and has a gender.","der Tisch, die Stadt, das Glück"],
 gender:["Gender","das Genus","Every German noun is masculine (der), feminine (die) or neuter (das). It is grammar, not biology: das Mädchen (the girl) is neuter. Learn every noun with its article.","der Löffel, die Gabel, das Messer"],
 article:["Article","der Artikel","The small word before a noun: der/die/das (the) or ein/eine (a). It shows gender, number and case.","der Mann, eine Frau"],
 definite:["Definite article","der bestimmte Artikel","der, die, das = “the”. For something known or specific.","Der Kaffee ist heiß."],
 indefinite:["Indefinite article","der unbestimmte Artikel","ein, eine = “a / an”. For something new or not specific. No plural form.","Ich trinke einen Kaffee."],
 plural:["Plural","der Plural","More than one. The plural article is always die. The noun ending changes in several ways, so learn it with the word.","der Tisch → die Tische"],
 pronoun:["Pronoun","das Pronomen","A short word that replaces a noun: ich, du, er, sie, es … It changes with the case too (er → ihn → ihm).","Der Mann ist nett. <b>Er</b> hilft mir."],
 case:["Case","der Kasus","The form of article, pronoun or adjective that shows the job of a word in the sentence. German has four: nominative, accusative, dative, genitive. Word order alone does not tell you who does what — the case does.","<b>Der</b> Hund sieht <b>den</b> Mann."],
 nominative:["Nominative","der Nominativ","The case of the subject (who does it?). The dictionary form: der, die, das, ein, eine. Also after sein: Das ist <b>der</b> Lehrer.","<b>Der</b> Bus kommt."],
 accusative:["Accusative","der Akkusativ","The case of the direct object (Wen? Was?) and after some prepositions (für, ohne, durch, gegen). Only the masculine changes: der → den, ein → einen.","Ich sehe <b>den</b> Bus."],
 dative:["Dative","der Dativ","The case of the indirect object (Wem? — to whom?) and after prepositions like mit, bei, nach, von, zu, aus, seit. Masculine/neuter → dem, feminine → der, plural → den (+n).","Ich fahre mit <b>dem</b> Bus."],
 genitive:["Genitive","der Genitiv","The case that shows who something belongs to. At A2 you mainly use it with names: Annas Auto (Anna's car). In everyday speech von + dative is common: das Auto von Anna.","Annas Bruder"],
 possessive:["Possessive article","der Possessivartikel","Words that show who something belongs to: mein (my), dein (your), sein (his), ihr (her/their), unser (our). They take the same endings as ein.","<b>mein</b> Bruder, <b>meine</b> Schwester"],
 adjective:["Adjective","das Adjektiv","A word that describes a noun: big, new, red. After sein it has no ending (Das Haus ist alt). Before a noun it gets an ending (das alte Haus).","groß, schön, teuer"],
 ending:["Ending","die Endung","The last letters added to a word to fit person, gender or case: lern<b>st</b>, ein<b>en</b>, neu<b>e</b>.","ein neu<b>er</b> Tisch"],
 comparative:["Comparative","der Komparativ","The form for comparing two things: adjective + -er (often with umlaut), followed by als.","schnell → schnell<b>er</b> als"],
 superlative:["Superlative","der Superlativ","The highest degree: am + adjective + -sten.","am schnell<b>sten</b>, am besten"],
 preposition:["Preposition","die Präposition","A small word that shows place, time or direction: in, auf, mit, für, nach … Each preposition requires a certain case.","mit dem Bus, für dich, im Park"],
 twoway:["Two-way preposition","die Wechselpräposition","in, an, auf, über, unter, vor, hinter, neben, zwischen. They take the dative for Wo? (place, no movement) and the accusative for Wohin? (direction, movement).","Ich bin <b>im</b> Park. Ich gehe <b>in den</b> Park."],
 conjunction:["Conjunction","die Konjunktion","A word that connects words or sentences. Some keep the normal word order (und, oder, aber, denn), others send the verb to the end (weil, dass, wenn, ob).","Ich bleibe zu Hause, <b>weil</b> ich krank bin."],
 mainclause:["Main clause","der Hauptsatz","A sentence that can stand alone. The conjugated verb is in position 2.","Ich <b>lerne</b> Deutsch."],
 subclause:["Subordinate clause","der Nebensatz","A part of a sentence that cannot stand alone. It starts with a word like weil, dass, wenn, ob or a relative pronoun, and the conjugated verb goes to the very end. A comma separates it.","…, weil ich Zeit <b>habe</b>."],
 position2:["Verb in position 2","Verb auf Position 2","The golden rule of German main clauses: the conjugated verb is always the second element. The first element can be the subject, a time, a place, an object…","Heute <b>gehe</b> ich ins Kino."],
 bracket:["Sentence bracket","die Satzklammer","German often splits the verb into two parts: one in position 2, the other at the end. Everything else goes in between, like inside brackets.","Ich <b>habe</b> gestern Pizza <b>gegessen</b>."],
 modal:["Modal verb","das Modalverb","Verbs that change the meaning of another verb: können (can), müssen (must), wollen (want), dürfen (may), sollen (should), möchten (would like). The second verb goes to the end as an infinitive.","Ich <b>muss</b> heute <b>arbeiten</b>."],
 separable:["Separable verb","das trennbare Verb","A verb with a prefix that splits off and goes to the end of the sentence. The prefix is stressed: ˈaufstehen, ˈeinkaufen, ˈanrufen.","Ich <b>stehe</b> um 7 Uhr <b>auf</b>."],
 inseparable:["Inseparable verb","das untrennbare Verb","A verb with a prefix that never splits off: be-, ver-, er-, ent-, emp-, ge-, zer-. The prefix is not stressed. In the Perfekt it gets no ge-.","besuchen → besucht"],
 auxiliary:["Helping verb","das Hilfsverb","haben, sein or werden used together with another verb to build a tense. It is the conjugated part in position 2.","Ich <b>habe</b> gegessen. Ich <b>bin</b> gefahren."],
 participle:["Partizip II (past participle)","das Partizip II","The past form used in the Perfekt, at the end of the sentence. Regular: ge- + stem + -t (gemacht). Irregular: ge- + changed stem + -en (gefahren).","machen → gemacht, fahren → gefahren"],
 present:["Present tense","das Präsens","For now, for habits, and very often for the future (with a time word).","Ich lerne. Morgen fahre ich nach Berlin."],
 perfekt:["Perfekt","das Perfekt","The spoken past tense: haben/sein (position 2) + Partizip II (end). Germans use it in conversation for almost everything in the past.","Ich habe Deutsch gelernt."],
 praeteritum:["Präteritum (simple past)","das Präteritum","The written past tense. In speaking you mostly use it only for sein, haben and modal verbs: war, hatte, musste, konnte.","Gestern <b>war</b> ich müde."],
 future:["Future","das Futur","werden + infinitive. For plans, promises and guesses. Often the present tense with a time word is enough.","Ich <b>werde</b> dich <b>anrufen</b>."],
 imperative:["Imperative","der Imperativ","The form for instructions, requests and advice: Komm! Kommt! Kommen Sie! Add bitte to make it polite.","Mach bitte das Fenster zu!"],
 reflexive:["Reflexive verb","das reflexive Verb","A verb that comes with sich — the action goes back to the subject: ich freue mich, du freust dich. The pronoun changes with the person.","Ich <b>freue mich</b> auf den Urlaub."],
 negation:["Negation","die Negation","Saying no: kein/keine for nouns with ein or without article; nicht for everything else (verbs, adjectives, nouns with der/die/das).","Ich habe <b>keine</b> Zeit. Ich komme <b>nicht</b>."],
 wword:["W-question","die W-Frage","A question with a question word (wer, was, wo, wann, wie, warum…). The W-word is first, the verb second.","<b>Wo</b> wohnst du?"],
 yesno:["Yes/no question","die Ja/Nein-Frage","A question you answer with ja, nein or doch. The verb comes first.","<b>Kommst</b> du mit?"],
 ordinal:["Ordinal number","die Ordinalzahl","Numbers for order: first, second, third (erste, zweite, dritte). Used for dates.","am <b>dritten</b> Mai"],
 konj2:["Konjunktiv II","der Konjunktiv II","The form for wishes, dreams, polite requests and “if” situations that are not real: würde, hätte, wäre, könnte.","Ich <b>hätte</b> gern mehr Zeit."],
 relative:["Relative clause","der Relativsatz","A subordinate clause that describes a noun, starting with der/die/das (= who, which, that). Verb at the end.","der Mann, <b>der</b> neben mir wohnt"],
 indirect:["Indirect question","die indirekte Frage","A question inside a sentence: Weißt du, wo …? Can you tell me if …? The verb moves to the end.","Ich weiß nicht, <b>ob</b> er kommt."],
 adverb:["Adverb","das Adverb","A word that tells how, when or where: heute, oft, gern, hier. It never changes its form.","Ich trinke <b>gern</b> Tee."],
 umlaut:["Umlaut","der Umlaut","The two dots: ä, ö, ü. Many verbs and adjectives get an umlaut in some forms.","fahren → du f<b>ä</b>hrst, alt → <b>ä</b>lter"]
};
var GINTRO={
 "a1-verbs":"A [[verb]] tells you what someone does. In German the verb changes its [[ending]] for every person — this is called [[conjugation]]. You take the [[stem]] (lern-) and add -e, -st, -t, -en, -t, -en. Get this right and every sentence sounds correct.",
 "a1-wfrage":"There are two kinds of sentences here: statements and [[wword|W-questions]]. In both, the [[verb]] is the second element ([[position2]]). In a question, the W-word (wer, was, wo …) takes position 1.",
 "a1-irreg":"Some common [[verb|verbs]] change their vowel with du and er/sie/es: fahren → du fährst, sprechen → du sprichst. The [[ending|endings]] stay normal; only the vowel in the [[stem]] changes. You learn these verbs one by one.",
 "a1-janein":"A [[yesno]] starts with the [[verb]]. You answer with ja, nein — or doch, which means “yes” after a negative question (Kommst du nicht? – Doch!).",
 "a1-art":"Every German [[noun]] has a [[gender]]: masculine (der), feminine (die) or neuter (das). The [[definite]] tells you which one. You cannot always guess it, so always learn a noun together with its article.",
 "a1-plural":"[[plural]] means more than one. The article is always die, but the noun changes in different ways (-e, -n, -er, -s, sometimes an [[umlaut]]). There are tendencies, but the safest way is to learn the plural with each word.",
 "a1-habensein":"haben (to have) and sein (to be) are the two most important [[verb|verbs]] — and both are irregular. You need them for age, feelings, descriptions and later for the past tense ([[perfekt]]).",
 "a1-ein":"The [[indefinite]] ein/eine means “a/an”. You use it when something is mentioned for the first time or is not specific. Its form shows the [[gender]] of the noun. It has no [[plural]].",
 "a1-kein":"[[negation]] in German: kein is the negative of ein (“no / not a”). nicht negates verbs, adjectives and nouns with der/die/das. A quick test: if you could say ein — or nothing — before the noun, use kein.",
 "a1-impsie":"The polite [[imperative]] with Sie is used for instructions and requests to people you don't know well: the [[verb]] goes first, then Sie. Add bitte to sound friendly.",
 "a1-adjsein":"An [[adjective]] describes a noun. When it comes after sein (Das Haus ist alt.), it never changes. Endings only appear when it stands directly before a noun — that comes later in A2.",
 "a1-akk":"The [[accusative]] is the [[case]] of the [[object]] — the thing or person the action is done to. Ask Wen? or Was? (Ich kaufe … was? einen Apfel). Good news: only masculine words change (der → den, ein → einen).",
 "a1-moegen":"mögen means “to like” in general; möchten means “would like” and is the polite way to ask for something right now. You use möchten in shops, cafés and restaurants.",
 "a1-position":"In a German [[mainclause]] the [[verb]] is always in position 2. Position 1 can be the subject, a time, a place or an object. If something else is first, the subject moves behind the verb. This is the most important word-order rule.",
 "a1-zeit":"Time words need the right [[preposition]]: um for clock times, am for days and parts of the day, im for months and seasons, von … bis for a period. These are fixed — learn them as little phrases.",
 "a1-poss":"A [[possessive]] shows who something belongs to: mein, dein, sein, ihr … It takes the same [[ending|endings]] as ein, so in the [[accusative]] masculine you say meinen.",
 "a1-modal":"A [[modal]] (können, müssen, wollen …) changes the meaning of another verb. The modal verb is conjugated in position 2, and the main verb goes to the end as an [[infinitive]]. Together they form a [[bracket]].",
 "a1-trennbar":"A [[separable]] has a prefix (auf-, an-, ein-, mit- …) that splits off and goes to the end of the sentence. In the dictionary it's one word (aufstehen), in a sentence it's two (Ich stehe … auf).",
 "a1-pronakk":"A [[pronoun]] replaces a noun. As an [[object]] in the [[accusative]], the pronouns change: ich → mich, du → dich, er → ihn, wir → uns. You hear these constantly: Ich liebe dich. Siehst du ihn?",
 "a1-fuer":"Some [[preposition|prepositions]] always take the [[accusative]]: für (for), ohne (without), durch, gegen, um. After für, masculine words change: für den Chef, für meinen Bruder.",
 "a1-praet":"The [[praeteritum]] is a past tense. In conversation, Germans use it mainly for sein and haben: war (was) and hatte (had). For other verbs they use the [[perfekt]].",
 "a1-datum":"For dates German uses [[ordinal|ordinal numbers]] (first, second, third…). With am they end in -ten up to 19 and -sten from 20. Some are irregular: ersten, dritten, siebten.",
 "a1-undoder":"A [[conjunction]] like und, oder, aber, denn connects two sentences without changing the word order — both parts stay normal [[mainclause|main clauses]] with the verb in position 2.",
 "a1-dativ":"The [[dative]] is the third [[case]]. You need it after mit, bei, nach, von, zu, aus, seit and for the person who receives something (Wem?). All articles change: der/das → dem, die → der, plural → den.",
 "a1-ortdat":"Places often use a [[preposition]] + [[dative]], and German likes short forms: in dem → im, an dem → am, bei dem → beim, zu dem → zum, zu der → zur.",
 "a1-imp":"The [[imperative]] gives instructions or advice. There are three forms: du (Komm!), ihr (Kommt!) and Sie (Kommen Sie!). For du you drop the -st and the du: du kommst → Komm!",
 "a1-sollen":"sollen, müssen and nicht dürfen are [[modal|modal verbs]] for rules and advice. Careful: nicht müssen means “don't have to”, but nicht dürfen means “must not / not allowed”.",
 "a1-inakk":"Wo? (where?) describes a place without movement → [[dative]]: im Kino. Wohin? (where to?) describes movement to a place → [[accusative]]: ins Kino. This is your first meeting with [[twoway|two-way prepositions]].",
 "a1-perfekt":"The [[perfekt]] is the spoken past tense. You build it with a [[auxiliary|helping verb]] (haben or sein) in position 2 and the [[participle]] at the end. Most verbs use haben; verbs of movement and change use sein.",
 "a1-welcher":"welcher? asks “which one?” and dieser points to “this one”. Both take the same [[ending|endings]] as der/die/das: welcher Rock? – dieser Rock. Welche Hose? – diese Hose.",
 "a1-prondat":"Some [[pronoun|pronouns]] are in the [[dative]]: mir, dir, ihm, ihr, uns, euch, ihnen. Some verbs always need the dative: helfen, gefallen, gehören, passen, danken. Das gefällt mir = I like that.",
 "a1-pp2":"The [[participle]] usually starts with ge-. With a [[separable]] verb, ge- goes between prefix and verb (eingekauft). An [[inseparable]] verb and verbs on -ieren get no ge- at all (besucht, studiert).",
 "a1-man":"man means “one / you / people in general” and takes the er/sie/es form of the verb. denn makes a question softer and more natural. wer/wen/wem are the question words for the three [[case|cases]].",
 "a1-zeitdat":"The time [[preposition|prepositions]] vor (before / ago), nach (after) and seit (since / for) always take the [[dative]]. Important: with seit, German uses the [[present]] tense.",
 "a2-genitiv":"The [[genitive]] shows possession. With names you just add -s, without an apostrophe: Annas Auto. In everyday speech many people say das Auto von Anna instead.",
 "a2-weil":"weil (because) is a [[conjunction]] that starts a [[subclause]]. In a subordinate clause the conjugated verb jumps to the very end. A comma always comes before weil.",
 "a2-modalprt":"[[modal|Modal verbs]] in the past use the [[praeteritum]], not the Perfekt: musste, konnte, wollte, durfte, sollte. Recipe: no umlaut + -te.",
 "a2-possdat":"A [[possessive]] in the [[dative]] takes the same endings as einem/einer: mit meinem Bruder, mit meiner Schwester, mit meinen Eltern.",
 "a2-komp":"To compare, you use the [[comparative]] (-er + als: größer als) and the [[superlative]] (am -sten: am größten). Short adjectives often get an [[umlaut]], and gut, viel, gern are irregular.",
 "a2-alswie":"For equal things: so … wie (as … as). For different things: [[comparative]] + als (bigger than). Never use wie after a comparative.",
 "a2-dass":"dass (that) is a [[conjunction]] that starts a [[subclause]]: the verb goes to the end. You use it after verbs of saying, thinking and feeling: Ich glaube, dass …",
 "a2-wenn":"wenn (if / when) starts a [[subclause]] with the verb at the end. If the wenn-clause comes first, the [[mainclause]] starts with its verb: Wenn ich Zeit habe, komme ich.",
 "a2-reflexiv":"A [[reflexive]] verb comes with sich. The pronoun changes with the person (mich, dich, sich, uns, euch, sich). Many feelings work like this: sich freuen, sich ärgern.",
 "a2-adjbest":"An [[adjective]] before a noun needs an [[ending]]. After der/die/das the article already shows the [[case]] and [[gender]], so the adjective only takes -e or -en.",
 "a2-ohnemit":"Every [[preposition]] decides the [[case]]: ohne always takes the [[accusative]] (ohne den Hund), mit always takes the [[dative]] (mit dem Hund).",
 "a2-koennte":"könnte is the [[konj2]] form of können. It makes requests much more polite: Könnten Sie mir helfen? sounds friendlier than Können Sie …?",
 "a2-adjunbest":"After ein/eine the article doesn't always show the [[gender]] (ein can be masculine or neuter), so the [[adjective]] shows it: ein neu<b>er</b> Tisch, ein neu<b>es</b> Auto.",
 "a2-werden":"werden means “to become” (Ich werde Ärztin). With an [[infinitive]] it forms the [[future]]: Ich werde dich anrufen.",
 "a2-indirekt":"An [[indirect]] question is a question inside another sentence (Können Sie mir sagen, …?). It works like a [[subclause]]: the verb goes to the end. Yes/no questions use ob.",
 "a2-woher":"Direction words depend on the question: Wohin? (to), Wo? (at) and Woher? (from). Cities use nach / in / aus, people and shops use zu / bei / von.",
 "a2-sollte":"sollte is the [[konj2]] form of sollen. You use it to give advice politely: Du solltest mehr schlafen = You should sleep more.",
 "a2-wasfuer":"Was für ein …? asks about the kind of thing (what kind of?), while welcher? asks about a choice between known things (which one?).",
 "a2-deshalb":"deshalb (that's why) and trotzdem (anyway) connect ideas. They take position 1 in the sentence, so the verb comes right after them ([[position2]]).",
 "a2-datakk":"Some verbs have two [[object|objects]]: a person in the [[dative]] (Wem?) and a thing in the [[accusative]] (Was?): Ich gebe dem Kind den Ball. Usually: person first, then thing.",
 "a2-wechsel":"A [[twoway]] (in, auf, unter …) takes the [[dative]] when something is somewhere (Wo?) and the [[accusative]] when something moves there (Wohin?). The verb pairs liegen/legen, stehen/stellen show the difference.",
 "a2-alswenn":"Both mean “when”. als is for one single event in the past. wenn is for repeated events (every time) and for the present and future. Both start a [[subclause]].",
 "a2-konj2":"The [[konj2]] expresses wishes, dreams and things that are not real: Ich hätte gern …, Ich wäre gern …, Ich würde gern … It is also the polite form.",
 "a2-verbpraep":"Some [[verb|verbs]] always come with a fixed [[preposition]]: sich freuen auf, warten auf, sich interessieren für. Learn them as one unit. In questions about things you use wo(r)+preposition: Worauf? Wofür?",
 "a2-indef":"jemand (someone), niemand (no one), etwas (something), nichts (nothing) are words for unknown people and things. They are used like nouns but are written small.",
 "a2-relativ":"A [[relative]] describes a noun in more detail, like “who” or “that” in English. The relative pronoun has the gender of the noun and the case of its job in the clause. The verb goes to the end."

}

function tokNorm(t){return String(t).toLowerCase().replace(/[.,!?;:"„“'’()…]/g,"")}
function units(tokens){
  // group a preposition/time word with the next word (and "Uhr"), e.g. "am Wochenende", "um acht Uhr"
  var out=[],i=0;
  while(i<tokens.length){
    var t=tokens[i];
    if(TIMEPREP[t]&&i+1<tokens.length){var u=[t,tokens[i+1]];var j=i+2;
      if(j<tokens.length&&/^(dem|der|den|des|einem|einer|meinem|meiner)$/.test(tokens[i+1])&&j<tokens.length){u.push(tokens[j]);j++}
      if(j<tokens.length&&tokens[j]==="uhr"){u.push("uhr");j++}
      out.push({t:u.join(" "),m:true});i=j;continue}
    out.push({t:t,m:!!MOVABLE[t]});i++;
  }
  return out;
}
function orderOk(built,answer){
  var b=built.map(tokNorm),a=answer.map(tokNorm);
  if(b.join(" ")===a.join(" "))return 2;
  if(b.slice().sort().join("|")!==a.slice().sort().join("|"))return 0;
  var ua=units(a),lastMov=ua.length&&ua[ua.length-1].m;
  if(b[0]!==a[0]||(!lastMov&&b[b.length-1]!==a[a.length-1]))return 0;
  // everything before the first movable phrase (subject + verb) must stay exactly in place
  var fi=-1;for(var k=0;k<ua.length;k++){if(ua[k].m){fi=k;break}}
  var pre=fi===0?ua.slice(0,2):fi>0?ua.slice(0,fi):ua;pre=pre.map(function(u){return u.t}).join(" ");
  if((b.join(" ")+" ").indexOf(pre+" ")!==0)return 0;
  var bs=" "+b.join(" ")+" ",as=" "+a.join(" ")+" ";
  ua.forEach(function(u){if(u.m&&bs.indexOf(" "+u.t+" ")>-1&&as.indexOf(" "+u.t+" ")>-1){bs=bs.replace(" "+u.t+" "," ");as=as.replace(" "+u.t+" "," ")}});
  // after removing movable time/place phrases and adverbs, the rest must be in the same order, and the verb must stay second
  if(bs.trim()===as.trim()&&b[1]===a[1])return 1;
  return 0;
}

  if(typeof d.xp!=="number")d.xp=0;if(!d.badges||typeof d.badges!=="object")d.badges={};d.stats=Object.assign({sessions:0,perfect:0,bestCombo:0,tests:0},d.stats||{});
  if(!Array.isArray(d.own))d.own=[];if(!Array.isArray(d.ret))d.ret=[];if(!Array.isArray(d.recent))d.recent=[];if(!Array.isArray(d.hist))d.hist=[];

    if(p.iv===undefined){p.iv=p.s===2?21:[0,1,3,7,12][Math.min(p.b||0,4)];p.ef=2.3;p.lapses=0}

/* ===== adaptive memory model =====
   Every word has an interval (days until the next review) and an ease.
   Right → the interval grows by the ease (1 → 2 → 5 → 12 → 30 days …), ease goes up a little.
   With hint → small step only. Wrong → interval shrinks to about a third, ease goes down, back tomorrow.
   A word counts as memorized when its interval reaches 12 days (4 right answers on 4 days in a row of growing gaps). */
var MEM_IV=12;
function prog(de){return S.w[de]||null}
function stOf(de){var p=S.w[de];return p?p.s:0}
function inLevel(ch){var l=S.settings.level;return ch==="own"||l==="both"||ch.indexOf(l)===0}
function gradeWord(de,res,extra){
  var p=S.w[de],now=dk(Date.now()),d=today(),wasMem=!!(p&&p.s===2),v=findW(de);
  if(!p)p=S.w[de]={s:1,iv:0,ef:2.3,due:Date.now(),intro:now,r:0,x:0,lapses:0,chk:0};
  p.last=Date.now();
  if(wasMem&&!extra){S.ret.push(res==="wrong"?0:1);if(S.ret.length>100)S.ret=S.ret.slice(-100)}
  if(wasMem&&p.placed&&!p.chk&&v&&!extra){var c=S.pchk[v.ch]||(S.pchk[v.ch]={ok:0,n:0});c.n++;if(res!=="wrong")c.ok++}
  if(res==="wrong"){
    p.x++;p.lapses=(p.lapses||0)+1;p.ef=Math.max(1.3,p.ef-0.2);p.iv=Math.max(1,Math.round(p.iv*0.35));
    if(p.s===2){p.s=1;p.iv=Math.min(MEM_IV-1,p.iv)}p.due=dayStart(1);return;
  }
  if(extra)return;
  if(res==="hint"){p.ef=Math.max(1.3,p.ef-0.1);p.iv=Math.max(1,Math.round(p.iv*1.2));p.due=dayStart(p.iv);return}
  p.r++;if(wasMem)p.chk=(p.chk||0)+1;
  p.iv=Math.min(240,p.iv<1?1:Math.max(p.iv+1,Math.round(p.iv*p.ef)));p.ef=Math.min(3,p.ef+0.05);
  if(p.s===1&&p.iv>=MEM_IV){p.s=2;p.memAt=now;d.mem++}
  p.due=dayStart(p.iv);
}
function counts(filterFn){
  var c={n:0,l:0,m:0,t:0,k:0};
  allWords().forEach(function(v){if(filterFn&&!filterFn(v))return;c.t++;var p=S.w[v.de],s=p?p.s:0;if(s===2){c.m++;if(p.placed&&!p.chk)c.k++}else if(s===1)c.l++;else c.n++});
  return c;
}
function dueWords(){
  var now=Date.now();
  return allWords().filter(function(v){var p=S.w[v.de];return p&&p.due<=now}).sort(function(a,b){return S.w[a.de].due-S.w[b.de].due});
}
function newCandidates(){
  var f=S.settings.focus,list=allWords().filter(function(v){return !S.w[v.de]&&inLevel(v.ch)});
  var pin=(S.pin||[]).map(findW).filter(function(v){return v&&!S.w[v.de]});
  list=list.filter(function(v){return pin.indexOf(v)<0});

  book.sort(function(a,b){var fa=a.ch===f?0:1,fb=b.ch===f?0:1;if(fa!==fb)return fa-fb;return CHMAP[a.ch].i-CHMAP[b.ch].i});
  return pin.concat(own,book);
}

}

function migrateVocabV2(){
  if((S.vocabV||1)>=2)return;
  var newSet={};NEW_V2.forEach(function(de){newSet[de]=1});
  var started=Object.keys(S.w).length>0;
  if(started||S.place){
    var cur=-1;  // first chapter (book order) that still has an old, not-started word
    for(var i=0;i<CHAPTERS.length;i++){var c=CHAPTERS[i];if(c.id==="own"||!inLevel(c.id))continue;
      if(VOC.some(function(v){return v.ch===c.id&&!newSet[v.de]&&!S.w[v.de]})){cur=i;break}}
    if(cur<0)cur=CHAPTERS.length;
    var t0=dk(Date.now()),n=0;
    VOC.forEach(function(v,i){if(!newSet[v.de]||S.w[v.de])return;var ci=CHMAP[v.ch]?CHMAP[v.ch].i:99;
      if(ci<cur){S.w[v.de]={s:2,iv:21,ef:2.3,placed:true,due:dayStart(3+(n*5)%88),intro:t0,r:0,x:0,lapses:0,chk:0};n++}});

/* ===== level check (placement) =====
   Every third chapter first (3 words + 1 grammar; one word must be typed), then it narrows down.
   The first chapter with less than 3 of 4 right becomes your starting point. */
var PL=null,COARSE=[2,5,8,11,14,17,20,23];
function blockQuestions(idx){
  var ch=CHAPTERS[idx].id,qs=[];
  shuffle(VOC.filter(function(v){return v.ch===ch&&v.en.length<40})).slice(0,3).forEach(function(w,i){
    var noun=!!artOf(w.de);
    if(i===0){qs.push({kind:"type",prompt:w.en,sub:noun?"Type it in German, with der, die or das.":"Type it in German.",expected:w.de,noun:noun,ch:ch});return}
    var q=mk("pl","pl:"+w.de,w.de,"What does it mean?",w.en,VOC.filter(function(x){return x.de!==w.de&&!!artOf(x.de)===noun&&!overlap(x.en,w.en)}).map(function(x){return x.en}),"");
    if(q){q.ch=ch;qs.push(q)}
  });
  var gts=GRAMMAR.filter(function(g){return g.ch===ch});
  for(var t=0;t<15&&gts.length;t++){var gq=null;try{gq=genTopic(pick(gts).id)}catch(e){}if(gq&&!gq.kind){gq.ch=ch;qs.push(gq);break}}
  return shuffle(qs);
}
function startPlacement(){
  PL={phase:"coarse",ci:0,pass:-1,fail:null,fineNext:null,idx:null,qs:[],i:0,ok:0,asked:0,log:[],done:false,start:0};
  nextBlock();pushOverlay("place");
}
function nextBlock(){
  var idx=null;
  if(PL.phase==="coarse"){if(PL.ci<COARSE.length)idx=COARSE[PL.ci];else{PL.phase="fine";PL.fineNext=PL.pass+1}}
  if(PL.phase==="fine"){
    var to=(PL.fail===null?CHAPTERS.length:PL.fail)-1;
    if(PL.fineNext!==null&&PL.fineNext<=to)idx=PL.fineNext;else{finishPlacement();return}
  }
  PL.idx=idx;PL.qs=blockQuestions(idx);PL.i=0;PL.ok=0;
  if(!PL.qs.length)blockDone(true);
}
function blockDone(skip){
  var n=PL.qs.length,passed=skip?true:PL.ok>=Math.ceil(n*0.75);
  if(!skip)PL.log.push({idx:PL.idx,ok:PL.ok,n:n});
  if(PL.phase==="coarse"){
    if(passed){PL.pass=PL.idx;PL.ci++;if(PL.ci>=COARSE.length){PL.phase="fine";PL.fineNext=PL.pass+1}}
    else{PL.fail=PL.idx;PL.phase="fine";PL.fineNext=PL.pass+1}
  }else{
    if(passed){PL.pass=PL.idx;PL.fineNext=PL.idx+1}
    else{PL.fail=PL.idx;finishPlacement();return}
  }
  nextBlock();
}
function finishPlacement(){PL.done=true;PL.start=PL.fail!==null?PL.fail:Math.min(CHAPTERS.length-1,PL.pass+1)}
function placeAnswer(ok){PL.asked++;if(ok)PL.ok++;PL.i++;if(PL.i>=PL.qs.length)blockDone(false);render();focusSel("#plIn")}

}

    '<label for="aEn">Meaning</label><input type="text" id="aEn" autocomplete="off" placeholder="gripper">'+
    '<label for="aPl">Plural (optional, without die)</label><input type="text" id="aPl" autocomplete="off" placeholder="Greifer">'+
    '<label for="aEx">Example sentence (optional)</label><input type="text" id="aEx" autocomplete="off" placeholder="Der Greifer hält das Teil.">'+
    '<label for="aExEn">Translation of the example (optional)</label><input type="text" id="aExEn" autocomplete="off"></div>'+
    '<button class="btn primary block" data-act="addsave">Add word</button></div>';
}

/* ===== render (with a safety net) ===== */
var TABS=[["today","Today"],["words","Words"],["grammar","Grammar"],["life","Life"],["tests","Practice"],["progress","Progress"]];
function render(){
  try{
    applyTheme();
    var v=ui.tab==="today"?viewToday():ui.tab==="words"?viewWords():ui.tab==="grammar"?viewGrammar():ui.tab==="life"?viewLife():ui.tab==="tests"?viewTests():viewProgress();
    $("#app").innerHTML=v;
    $("#tabin").innerHTML=TABS.map(function(t){return '<button data-act="tab|'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+IC[t[0]]+'<span>'+t[1]+'</span></button>'}).join("");
    var o=$("#overlay"),t=top();
    if(t){
      var h=t.name==="place"?ovPlace():t.name==="session"?ovSession():t.name==="quiz"?ovQuiz():t.name==="read"?ovRead(t):t.name==="terms"?ovTerms():t.name==="kit"?ovKit(t):t.name==="exam"?ovExam():t.name==="chapter"?ovChapter(t):t.name==="word"?ovWord(t):t.name==="topic"?ovTopic(t):t.name==="settings"?ovSettings():ovAdd();
      o.innerHTML=h;o.classList.add("on");document.body.classList.add("noscroll");
    }else{o.classList.remove("on");o.innerHTML="";document.body.classList.remove("noscroll")}
  }catch(err){
    try{save()}catch(e){}
    var o2=$("#overlay");if(o2){o2.classList.remove("on");o2.innerHTML=""}
    document.body.classList.remove("noscroll");ui.stack=[];SS=null;QZ=null;PL=null;
    $("#app").innerHTML='<div class="card warn" style="margin-top:30px"><h2>Something went wrong</h2><p class="small">Your progress is saved. Tap Reload. If it keeps happening, save a backup and send me this message:</p><pre class="small" style="white-space:pre-wrap">'+esc(String(err&&err.message||err))+'</pre><div class="row gap wrap"><button class="btn primary" data-act="reload">Reload</button><button class="btn" data-act="exportFile">Save backup</button></div></div>';
  }
}

/* ===== events ===== */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act").split("|");
  try{handle(a[0],a[1],a[2],a,el)}catch(err){toast("Error: "+(err&&err.message||err));try{render()}catch(x){}}
});
function resetDailyIfUnused(){if(S.daily&&S.daily.day===dk(Date.now())&&!S.daily.doneAt&&!S.daily.newIds.some(function(de){return S.w[de]}))S.daily=null}
function handle(act,p1,p2,a,el){
  a=a||[act,p1,p2];
  if(act==="kit"||act==="kitSpeak"){KT=null;pushOverlay("kit",{id:p1,tab:act==="kitSpeak"?"speak":"listen"});return}
  if(KT&&handleKit(act,p1))return;
  if(handleExam(act,p1))return;
  switch(act){
    case "reload":location.reload();break;
    case "tab":ui.stack=[];ui.tab=p1;render();window.scrollTo(0,0);break;
    case "back":if(top()&&top().name==="quiz")finishQuiz();popOverlay();break;
    case "settings":pushOverlay("settings");break;
    case "wlv":ui.wlv=p1;render();break;
    case "glv":ui.glv=p1;render();break;
    case "chapter":pushOverlay("chapter",{id:p1});break;
    case "word":pushOverlay("word",{de:p1});break;
    case "topic":pushOverlay("topic",{id:p1});break;
    case "read":RD=null;var rdx=readById(p1)||nextRead(p1);if(rdx)pushOverlay("read",{id:rdx.id});break;
    case "gterm":GT_SEL=GT_SEL===p1?null:p1;render();break;
    case "gtermClose":GT_SEL=null;render();break;
    case "terms":pushOverlay("terms");break;
    case "micHelp":MICHELP=true;render();break;
    case "micHelpClose":MICHELP=false;render();break;
    case "micRetry":S.settings.mic="ok";MICHELP=false;MIC=null;LT=null;save();toast("OK — tap Speak to try again.");render();break;
    case "readGo":RD=null;ui.stack.pop();pushOverlay("read",{id:p1});break;
    case "rw":RD.sel=(RD.sel&&RD.sel.si===+p1&&RD.sel.wi===+p2)?null:{si:+p1,wi:+p2};render();break;
    case "rwClose":RD.sel=null;render();break;
    case "rwAll":RD.all=!RD.all;render();break;
    case "rwPin":if(!S.pin)S.pin=[];if(S.pin.indexOf(p1)<0)S.pin.push(p1);save();toast("Added — it comes in your next new words.");sfx("ok");render();break;
    case "addword":pushOverlay("add");break;
    case "say":speak(a.slice(1).join("|"),el&&el.textContent.indexOf("Slow")>-1?0.6:null);break;
    case "mic":listenFor(a.slice(1).join("|"));break;
    case "focus":S.settings.focus=S.settings.focus===p1?"auto":p1;resetDailyIfUnused();save();toast(S.settings.focus===p1?"New words now come from this chapter":"Back to automatic order");render();break;
    case "known":
      var pk=S.w[p1]||{};S.w[p1]={s:2,iv:21,ef:pk.ef||2.3,due:dayStart(21),intro:pk.intro||dk(Date.now()),r:pk.r||0,x:pk.x||0,lapses:pk.lapses||0,chk:0,memAt:dk(Date.now())};save();toast("Marked as known. It comes back in 3 weeks to check.");render();break;
    case "reset":delete S.w[p1];save();toast("This word starts again as new");render();break;
    case "delown":S.own=S.own.filter(function(o){return o.de!==p1});delete S.w[p1];save();popOverlay();toast("Deleted");break;
    case "addsave":
      var de=($("#aDe").value||"").trim(),en=($("#aEn").value||"").trim();
      if(!de||!en){toast("Fill in the German word and its meaning.");break}
      if(findW(de)){toast("This word is already in the app.");break}
      var exd=($("#aEx").value||"").trim();
      if(exd&&exd.indexOf("*")<0){var bare=de.replace(/^(der|die|das) /,""),ix=exd.toLowerCase().indexOf(bare.toLowerCase());if(ix>-1)exd=exd.slice(0,ix)+"*"+exd.slice(ix,ix+bare.length)+"*"+exd.slice(ix+bare.length)}
      S.own.push({ch:"own",de:de,en:en,pl:($("#aPl").value||"").trim(),ex:exd?{de:exd,en:($("#aExEn").value||"").trim(),t:""}:null});
      save();popOverlay();toast("Added. It comes in your next new words.");break;
    case "session":startSession(false);break;
    case "extra":startSession(true);break;
    case "scheck":sessionCheck();break;
    case "spick":sessionPick(+p1);break;
    case "sbAdd":SS.built.push(+p1);render();break;
    case "sbUn":SS.built.splice(+p1,1);render();break;
    case "sbClear":SS.built=[];render();break;
    case "sbCheck":sessionBuildCheck();break;
    case "sbMine":
      var cv=cur().v,pp=S.w[cv.de];if(pp){pp.x=Math.max(0,pp.x-1);pp.lapses=Math.max(0,(pp.lapses||0)-1);pp.due=dayStart(Math.max(1,pp.iv));}
      var cc0=S.cat.order;if(cc0&&cc0.h.length)cc0.h[cc0.h.length-1]=1;
      SS.ok++;SS.mine=true;var dd0=today();dd0.ok++;SS.res={st:"ok",msg:"Okay, counted as right."};save();render();break;
    case "snext":if(SS&&SS.phase!=="fix"){SS.mine=false;sessionNext()}break;
    case "shint":SS.draft=($("#sIn")||{}).value||"";SS.hint=(SS.hint||0)+2;render();focusSel("#sIn");break;
    case "sknow":
      if(!SS)break;knowNow(cur().v.de);toast("Marked as known. Here is a new word instead.");
      if(SS.i>=SS.items.length){SS.done=true;if(S.daily)S.daily.doneAt=Date.now();save();render();break}
      SS.phase="ask";sessionPrep();render();break;
    case "place":startPlacement();break;
    case "plPick":placeAnswer(+p1===PL.qs[PL.i].answer);break;
    case "plType":var pq=PL.qs[PL.i],pv=($("#plIn")||{}).value||"",pw=findW(pq.expected);placeAnswer(pv.trim()!==""&&(checkA(pv,pq.expected,pq.noun).st!=="wrong"||!!(pw&&synonymHit(pv,pw.de,pw.en))));break;
    case "plRetry":ui.stack.pop();startPlacement();break;
    case "plApply":var pi=+(($("#plSel")||{}).value||PL.start),kn=applyPlacement(pi);ui.stack.pop();PL=null;ui.wlv=CHAPTERS[pi].lv;ui.glv=CHAPTERS[pi].lv;render();toast(kn+" words marked as known. Your daily words now start at "+CHAPTERS[pi].lv+" Kapitel "+CHAPTERS[pi].n+".");break;
    case "placeSkip":S.place={ch:"A1-1",at:Date.now(),manual:true};save();render();break;
    case "unplace":var un=unplaceChapter(p1);resetDailyIfUnused();save();render();toast(un+" words from this chapter are back in your new words.");break;
    case "keepplace":if(S.pchk[p1])S.pchk[p1].dismissed=true;save();render();break;
    case "test":
      if(p1==="chapterSel"){startTest("chapter",($("#tch")||{}).value);break}
      startTest(p1,p2);break;
    case "qpick":
      if(QZ.picked!==null)break;QZ.picked=+p1;var q=QZ.qs[QZ.i];answerQuiz(QZ.picked===q.answer,q);render();focusSel("#qNext");break;
    case "qtype":
      var qq=QZ.qs[QZ.i];if(QZ.res!==null)break;var inp=($("#qIn")||{}).value||"";if(!inp.trim()){toast("Type your answer first.");break}
      var r=checkA(inp,qq.expected,qq.noun);if(r.st==="wrong"&&/^sich /.test(qq.expected)){var r2=checkA(inp,qq.expected.slice(5),false);if(r2.st!=="wrong")r=r2}
      if(r.st==="wrong"&&qq.type==="vtype"){var wv=findW(qq.expected),sy2=wv?synonymHit(inp,wv.de,wv.en):null;if(sy2)r={st:"ok",msg:"Also correct ("+sy2.de+")! Here we practice:"}}
      if(r.st!=="ok"){var cl=classify(r);if(cl==="vart"||cl==="vspell")recordCat(cl,false)}
      QZ.res=r;answerQuiz(r.st!=="wrong",qq);render();speak(qq.expected);focusSel("#qNext");break;
    case "qbAdd":QZ.built.push(+p1);render();break;
    case "qbUn":QZ.built.splice(+p1,1);render();break;
    case "qbClear":QZ.built=[];render();break;
    case "qbCheck":
      var qb=QZ.qs[QZ.i];if(QZ.res!==null)break;var got=[qb.lead].concat(QZ.built.map(function(i){return qb.tokens[i]})),oq=orderOk(got,qb.answer.split(" ")),okq=oq>0;
      QZ.res={st:okq?"ok":"wrong",msg:oq===2?"Richtig!":oq===1?"Also correct! The most common order is:":"Not quite. The order is:"};answerQuiz(okq,qb);render();speak(qb.answer+qb.punct,null,true);focusSel("#qNext");break;
    case "qbMine":
      var qm=QZ.qs[QZ.i],tt=S.top[qm.topic];if(tt&&tt.h.length){tt.h[tt.h.length-1]=1;tt.c++}var cc=S.cat[qm.cat];if(cc&&cc.h.length)cc.h[cc.h.length-1]=1;
      QZ.score++;QZ.missed.pop();QZ.mine=true;var b0=QZ.byTopic[qm.topic];if(b0)b0.c++;var dd=today();dd.ok++;save();QZ.res={st:"ok",msg:"Okay, counted as right."};render();break;
    case "qnext":
      if(QZ.i+1>=QZ.qs.length){QZ.done=true;finishQuiz();render();break}
      QZ.i++;QZ.picked=null;QZ.res=null;QZ.built=[];QZ.mine=false;render();focusSel("#qIn");var nq=QZ.qs[QZ.i];if(nq.audio)speak(nq.audio);break;
    case "bonus":SS=null;
      var gts=GRAMMAR.filter(function(g){return g.ch===currentChapter()}).map(function(g){return g.id});
      if(!gts.length)gts=levelTopicIds().filter(function(id){return id.indexOf("v:")<0});
      ui.stack=[];var bq=buildQuestions(gts,5);if(!bq.length){render();break}newQuiz("Bonus round","bonus",null,bq);pushOverlay("quiz");break;
    case "bonusQuick":ui.stack=[];startTest("quick");break;
    case "bonusRead":ui.stack=[];SS=null;RD=null;pushOverlay("read",{id:p1});break;
    case "badge":var bb=BADGES.find(function(x){return x[0]===p1});if(bb)toast(bb[1]+" "+bb[2]+": "+bb[3]+(S.badges[p1]?" ✓":""));break;
    case "qagain":var kind=QZ.kind,arg=QZ.arg;ui.stack.pop();QZ=null;if(kind==="bonus"){handle("bonus");break}startTest(kind,arg);break;
    case "rpick":
      var rr=readById(RD.id),qi=+p1,oi=+p2;if(RD.ans[qi]!==undefined)break;RD.ans[qi]=oi;
      var line=rr.q[qi].split("|"),okr=RD.order[qi][oi]===line[1];recordCat("vread",okr);var dr=today();dr.ans++;if(okr)dr.ok++;
      sfx(okr?"ok":"bad");addXP(okr?8:1);
      if(Object.keys(RD.ans).length===rr.q.length){var okn=rr.q.filter(function(l,i){return RD.order[i][RD.ans[i]]===l.split("|")[1]}).length;S.read[rr.id]={ok:okn,n:rr.q.length,at:Date.now()};addXP(15);markTimeOfDay();if(okn===rr.q.length)confetti();setTimeout(checkBadges,300)}
      save();render();break;
    case "exportFile":exportFile();break;
    case "export":
      var j=JSON.stringify(S),ta=$("#bk");ta.value=j;ta.select();
      try{navigator.clipboard.writeText(j).then(function(){toast("Copied. Paste it into Notes.");S.lastBackup=Date.now();save()},function(){toast("Select all and copy")})}catch(x){toast("Select all and copy")}break;
    case "import":try{importText($("#bk").value);render();toast("Imported")}catch(x){toast("That backup text is not valid.")}break;
    case "resetAll":
      if(el.getAttribute("data-sure")){S=defaults();save();ui.stack=[];ui.tab="today";render();toast("Everything erased")}
      else{el.setAttribute("data-sure","1");el.textContent="Tap again to erase everything";setTimeout(function(){el.removeAttribute("data-sure");el.textContent="Erase all"},4000)}break;
    case "lkNow":if(window.__lock)window.__lock.lockNow();break;
    case "lkSet":if(window.__lock)window.__lock.create();break;
    case "lkChange":
      if(!window.__lock)break;var lc=($("#lkCur")||{}).value||"",ln=($("#lkNew")||{}).value||"";
      if(ln.length<4){toast("New password: at least 4 characters.");break}
      window.__lock.change(lc,ln).then(function(ok){if(!ok)toast("Current password is wrong")});break;
    case "lkOff":if(!window.__lock)break;window.__lock.disable(($("#lkCur")||{}).value||"").then(function(ok){toast(ok?"Password turned off":"Type your current password first");if(ok)render()});break;
  }
}
document.addEventListener("change",function(e){
  var id=e.target&&e.target.id,v=e.target&&e.target.value;
  if(id==="setGoal"){S.settings.goalMin=+v;save()}
  else if(id==="setNew"){S.settings.newPerDay=+v;resetDailyIfUnused();save()}
  else if(id==="setLevel"){S.settings.level=v;resetDailyIfUnused();save()}
  else if(id==="setFocus"){S.settings.focus=v;resetDailyIfUnused();save()}
  else if(id==="setTheme"){S.settings.theme=v;save();applyTheme()}
  else if(id==="setSound"){S.settings.sound=v;save();if(v!=="off")sfx("ok")}
  else if(id==="setVoice"){S.settings.voice=v;save();loadVoices();speak("Hallo! So klinge ich.")}
  else if(id==="setRate"){S.settings.rate=+v;save();speak("Das ist meine Geschwindigkeit.")}
  else if(id==="bkFile"&&e.target.files&&e.target.files[0]){
    var fr=new FileReader();fr.onload=function(){try{importText(fr.result);render();toast("Backup loaded")}catch(x){toast("This file is not a valid backup.")}};fr.readAsText(e.target.files[0]);
  }
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="setRate"){var r=$("#rateVal");if(r)r.textContent=Math.round(e.target.value*100)+"%"}
  if(e.target&&e.target.id==="wsearch"){
    var had=!!ui.search;ui.search=e.target.value;
    if(!!ui.search!==had){var pos=e.target.selectionStart;render();var s=$("#wsearch");if(s){s.focus();try{s.setSelectionRange(pos,pos)}catch(x){}}}
    else{var r2=$("#wresults");if(r2)r2.innerHTML=searchResults()}
  }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||!e.target)return;
  if(e.target.id==="sIn"&&SS){e.preventDefault();sessionCheck()}
  else if(e.target.id==="qIn"&&QZ){e.preventDefault();handle("qtype")}
  else if(e.target.id==="plIn"&&PL){e.preventDefault();handle("plType")}
});
document.addEventListener("visibilitychange",function(){if(document.hidden)save();else if(!top())render()});
window.addEventListener("pagehide",save);
window.addEventListener("error",function(){try{save()}catch(x){}});

try{migrateVocabV2()}catch(e){}
render();
if(window.__SWAP_TEST)window.__ww={PL:function(){return PL},SS:function(){return SS},QZ:function(){return QZ},levelTopicIds:levelTopicIds,levelIdx:levelIdx,topicChIdx:topicChIdx,S:function(){return S},genTopic:genTopic,GRAMMAR:GRAMMAR,VOC:VOC,checkA:checkA,allTopicIds:allTopicIds,buildQuestions:buildQuestions,gradeWord:gradeWord,counts:counts,handle:handle,GEN2:GEN2,READ:READ,makeBuild:makeBuild,startSession:startSession,expectedOf:expectedOf,cur:cur,weekSum:weekSum,sessionPrep:sessionPrep,orderOk:orderOk,lookupWord:lookupWord,save:save,KITS:KITS,EXAM:EXAM,kitQuestions:kitQuestions,KT:function(){return KT},EX:function(){return EX},tokSplit:tokSplit,READ:READ,GRAMMAR:GRAMMAR};

try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
window.__lockChanged=function(){render()};
})();
