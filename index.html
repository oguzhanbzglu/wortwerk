<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wortwerk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2447F5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA;--surface:#FFFFFF;--surface2:#EEF1F8;--ink:#0E1A2B;--muted:#5D6A80;--line:#E1E6EF;
  --accent:#3355F0;--accent2:#7A4DF2;--accent-ink:#FFFFFF;--soft:#E8EDFF;--hl:#FFC93C;--hl-ink:#3A2700;--hlsoft:#FFF4D2;
  --good:#11A066;--goodsoft:#E3F6EC;--bad:#CF2E35;--badsoft:#FDECEC;--mid:#A15C00;
  --g-der:#2563EB;--g-die:#E0244E;--g-das:#047857;
  --hero1:#3355F0;--hero2:#7A4DF2;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --shadow-lg:0 10px 30px rgba(51,85,240,.28);
  --display:"Bricolage Grotesque","Avenir Next","SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","SF Pro Text",-apple-system,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F1E;--surface:#131A2C;--surface2:#1B2338;--ink:#EAF0FF;--muted:#94A1BB;--line:#252F47;
  --accent:#7D93FF;--accent2:#A78BFA;--accent-ink:#0A0F1E;--soft:#1D2750;--hl:#FFD25E;--hl-ink:#2A1C00;--hlsoft:#2E2610;
  --good:#3DD68C;--goodsoft:#11301F;--bad:#FF6B70;--badsoft:#3A1518;--mid:#F5B83D;
  --g-der:#7FA6FF;--g-die:#FF7C96;--g-das:#4BD9A0;
  --hero1:#3B52E6;--hero2:#7445E8;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0F1E;--surface:#131A2C;--surface2:#1B2338;--ink:#EAF0FF;--muted:#94A1BB;--line:#252F47;
  --accent:#7D93FF;--accent2:#A78BFA;--accent-ink:#0A0F1E;--soft:#1D2750;--hl:#FFD25E;--hl-ink:#2A1C00;--hlsoft:#2E2610;
  --good:#3DD68C;--goodsoft:#11301F;--bad:#FF6B70;--badsoft:#3A1518;--mid:#F5B83D;
  --g-der:#7FA6FF;--g-die:#FF7C96;--g-das:#4BD9A0;
  --hero1:#3B52E6;--hero2:#7445E8;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:14px 16px 112px;animation:fadeIn .25s ease}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-0.02em;line-height:1.12}
h1{font-size:30px;font-weight:800}h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.wrap{flex-wrap:wrap}.grow1{flex:1}
.stack>*+*{margin-top:10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
button.card{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
button.card:active{transform:scale(.985)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 4px}
.top>div:first-child{min-width:0}.top h1{font-size:clamp(24px,7.4vw,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.streak{white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;width:44px;height:44px;display:grid;place-items:center;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s ease,background .15s ease}
.btn.small{padding:7px 14px;font-size:14px}
.btn.primary{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-color:transparent;box-shadow:var(--shadow-lg)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.block{width:100%;padding:15px 18px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.say{padding:8px 12px}.btn.say.ghost{padding:8px;color:var(--accent)}
.btn.say.round{width:48px;height:48px;padding:0;border-radius:50%;background:var(--soft);color:var(--accent);border-color:transparent;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--soft);color:var(--accent);padding:4px 12px;font-weight:650;font-size:13px;border:0}
.chip.tiny{font-size:11px;padding:1px 8px;vertical-align:2px}
.chip.streak{background:var(--hlsoft);color:var(--mid);font-size:15px;padding:7px 12px}
.chip.link{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip.link{padding:8px 13px;min-height:36px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 2px;font-size:inherit;min-height:32px}
input[type=range]{height:32px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--hero1),var(--hero2));border-radius:99px;transition:width .35s ease}
.sbar{display:flex;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 0}
.sbar i{display:block;height:100%}.s-m{background:var(--good)}.s-l{background:var(--hl)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.c-m{color:var(--good)}.c-l{color:var(--mid)}.c-acc{color:var(--accent)}.c-bad{color:var(--bad)}
/* today */
.xpline{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.lvl{font-weight:800;font-family:var(--display);font-size:13px;color:var(--accent);background:var(--soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.xpbar{flex:1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hl),#FF9F43);border-radius:99px}
.xpn{font-size:12px;color:var(--muted);white-space:nowrap}
.goal{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:112px;height:112px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg-bg{fill:none;stroke:var(--surface2);stroke-width:11}
.rg-fg{fill:none;stroke:url(#rgGrad);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-in b{font-family:var(--display);font-size:34px;font-weight:800}.ring-in span{font-size:12px;color:var(--muted);margin-top:4px}
.goal-stats{flex:1;display:grid;gap:10px}
.goal-stats div{display:flex;align-items:baseline;gap:8px}.goal-stats b{font-family:var(--display);font-size:22px;min-width:44px}.goal-stats span{color:var(--muted);font-size:14px}
.hero{border:0;color:#fff;padding:20px 20px 18px;display:block;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.18),transparent 55%),linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:var(--shadow-lg)}
.hero-k{display:block;font-weight:650;opacity:.9;font-size:14px}
.hero-t{display:block;font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;margin:4px 0 6px;padding-right:96px}
.hero-s{display:block;opacity:.9;font-size:14px;padding-right:96px}
.hero-go{position:absolute;right:18px;bottom:18px;background:#fff;color:var(--hero1);border-radius:999px;padding:10px 20px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.hero-dots{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;padding-right:96px}
.hero-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)}
.hero-dots i.new{background:#fff}
.hero.done{background:var(--surface);color:var(--ink);border:2px solid var(--good);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.grid2 .card{margin-top:0}
.tile{display:flex;flex-direction:column;gap:3px;min-height:122px}
.tile-k{font-size:12px;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.tile-t{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.2}
.tile select{margin:6px 0 8px;padding:8px;font-size:14px}
.wotd{background:linear-gradient(180deg,var(--hlsoft),var(--surface))}
.wotd .wbig{font-family:var(--display);font-size:28px;font-weight:800;margin:2px 0}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}
.statgrid div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 4px;box-shadow:var(--shadow)}
.statgrid b{display:block;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.2}.statgrid span{font-size:12px;color:var(--muted);display:block}
.statgrid.wk div{background:var(--surface2);border:0;box-shadow:none}
.statgrid .delta{display:block;font-size:12px;font-weight:700}
/* lists */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:650;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:10px;box-shadow:var(--shadow)}
.row-item{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 16px}
.list>.row-item:first-child,.list>.wrow:first-child{border-top:0}
.ri-main{flex:1;display:flex;flex-direction:column;min-width:0}.ri-k{font-size:12px;color:var(--muted);font-weight:650}.ri-t{font-weight:700;font-family:var(--display);font-size:17px}
.ri-side{text-align:right;flex-shrink:0}.ri-side b{font-family:var(--display);font-size:20px}.ri-side span{font-size:12px;color:var(--muted);display:block}
.sec{margin:22px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:750}
.wrow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:8px 8px 8px 16px}
.wrow-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;padding:4px 0}
.w-de{font-weight:650}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;background:var(--line)}
.dot.d1{background:var(--hl)}.dot.d2{background:var(--good)}
.badge{font-size:12px;font-weight:750;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.b-new{background:var(--surface2);color:var(--muted)}.badge.b-good{background:var(--goodsoft);color:var(--good)}
.badge.b-mid{background:var(--hlsoft);color:var(--mid)}.badge.b-bad{background:var(--badsoft);color:var(--bad)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:var(--shadow)}
.trow{display:grid;grid-template-columns:1fr 70px 44px;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 0;font-size:14px}
.tbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.tbar i{display:block;height:100%}
.tbar .good{background:var(--good)}.tbar .mid{background:var(--hl)}.tbar .bad{background:var(--bad)}
.trow b{text-align:right}
details.card summary{cursor:pointer;list-style:none}details.card summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:8px}
/* badges grid */
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:11px;color:var(--muted);border:0;background:transparent;padding:0}
.bdg .bi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:var(--surface2);filter:grayscale(1);opacity:.45}
.bdg.on .bi{filter:none;opacity:1;background:linear-gradient(135deg,var(--hlsoft),var(--soft));box-shadow:var(--shadow)}
.bdg.on{color:var(--ink);font-weight:650}
/* charts */
.chart{display:flex;gap:4px;align-items:flex-end;height:120px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.col .pair{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
.col .pair i{display:block;width:70%;border-radius:5px 5px 2px 2px;min-height:2px}
.col .pair i.k-new,.col .pair i.k-mem{width:40%}
.col span{font-size:11px;color:var(--muted)}
.k-min{background:linear-gradient(180deg,var(--hero2),var(--hero1))}.k-new{background:var(--hl)}.k-mem{background:var(--good)}
.legend i.k-new{background:var(--hl)}.legend i.k-mem{background:var(--good)}
/* inputs */
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 13px}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
label{display:block;font-weight:650;font-size:14px;margin:12px 0 5px}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#tabs .in{display:flex;max-width:560px;margin:0 auto;padding:4px 6px 2px}
#tabs button{flex:1;border:0;background:transparent;padding:6px 2px 6px;color:var(--muted);font-weight:650;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px}
#tabs button[aria-current="page"]{color:var(--accent)}
#tabs button[aria-current="page"] svg{background:var(--soft);border-radius:10px;padding:3px;width:32px;height:28px}
/* overlays */
#overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
#overlay.on{display:block;animation:slideUp .22s ease}
.sheet{max-width:560px;margin:0 auto;min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.grow-top{flex:1;padding-top:8px;padding-bottom:16px}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:transparent;color:var(--accent);font-weight:650;padding:8px 4px;margin-left:-4px}
.wordbig{font-size:38px}
.lead{font-size:19px;margin:0 0 8px}
.exbox{background:var(--surface2);border:0;box-shadow:none}.ex-de{font-size:18px}
.hl{color:var(--accent)}
.prompt{font-size:24px;line-height:1.3;margin:14px 0 6px}.prompt.big{font-size:30px}
.prompt-big{font-size:32px;margin:14px 0 6px}
.answer{font-size:20px !important;padding:15px !important;border-width:2px !important}
.answer:focus{border-color:var(--accent) !important;outline:0}
.fb{border-width:2px;animation:pop .25s ease}.fb.ok{border-color:var(--good);background:var(--goodsoft)}.fb.bad{border-color:var(--bad);background:var(--badsoft);animation:shake .3s ease}
.fb.ok .fb-t{color:var(--good)}.fb.bad .fb-t{color:var(--bad)}
.fb-w{font-family:var(--display);font-size:26px;font-weight:800;margin-top:6px}
.pick{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:15px 16px;margin-bottom:10px;font-size:18px;font-weight:650;color:var(--ink);box-shadow:var(--shadow);transition:transform .1s ease}
.pick.small{font-size:16px}
.pick:disabled{opacity:1}
.pick.ok{border:2px solid var(--good);background:var(--goodsoft)}.pick.bad{border:2px solid var(--bad);background:var(--badsoft)}
.pick.idk{color:var(--muted);font-weight:500;border-style:dashed;box-shadow:none}
.miss{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line)}.miss:first-child{border-top:0}
.big-check{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--good),#36C98E);color:#fff;font-size:54px;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 12px 30px color-mix(in srgb,var(--good) 40%,transparent);animation:pop .4s ease}
.donestats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.donestats div{background:var(--surface);border-radius:16px;padding:12px 6px;box-shadow:var(--shadow)}
.donestats b{display:block;font-family:var(--display);font-size:24px}.donestats span{font-size:12px;color:var(--muted)}
.rule{font-size:17px;line-height:1.6}
.tbl{padding:6px 16px}.tr{display:grid;grid-template-columns:40% 60%;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.tr:first-child{border-top:0}.tr span:first-child{color:var(--muted)}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.exrow:first-child{border-top:0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:650;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;box-shadow:var(--shadow-lg)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.level{border:2px solid var(--hl);background:linear-gradient(180deg,var(--hlsoft),var(--surface))}
.warn{border:2px solid var(--hl)}
.chunkbox{border-style:dashed;box-shadow:none}
.mistake .mrow{display:flex;gap:10px;align-items:baseline;padding:4px 0}.m-x{color:var(--bad);font-weight:800}.m-ok{color:var(--good);font-weight:800}
.built{min-height:58px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface)}
.toks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-weight:650;font-size:17px;color:var(--ink);box-shadow:var(--shadow)}
.tok.on{background:var(--soft);color:var(--accent);border-color:transparent;box-shadow:none}
.tok.lead{background:var(--surface2);color:var(--ink);border-color:transparent;box-shadow:none}
.tok.ghost{opacity:.22;border-style:dashed;box-shadow:none}
.small2{font-size:20px !important}

<body>
<main id="app"></main>
<nav id="tabs" aria-label="Main"><div class="in" id="tabin"></div></nav>
<div id="overlay" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div id="xpfloat" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3355F0"/><stop offset="100%" stop-color="#A06BFF"/></linearGradient></defs></svg>
<div id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lkTitle"></div>
<style>
.is-locked #app,.is-locked #tabs,.is-locked #overlay{visibility:hidden}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
#lock[hidden]{display:none}
#lock .lk{max-width:420px;margin:0 auto;min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center}
#lock .lkicon{width:72px;height:72px;border-radius:18px;margin-bottom:22px}
#lock input{font-size:18px;padding:14px;margin-top:6px}
#lock .lkerr{color:var(--bad);font-weight:600;min-height:24px;margin:10px 0 0}
#lock .code{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:2px;background:var(--surface);border:2px dashed var(--accent);border-radius:14px;padding:16px;text-align:center;margin:14px 0;user-select:all;-webkit-user-select:all}
@keyframes lkshake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lock .shake{animation:lkshake .3s}
</style>
<script>
(function(){
"use strict";
var KEY="swap.lock",HID="swap.lockHiddenAt",root=document.documentElement,box=document.getElementById("lock");
var cfg=read(),mode=null,fails=0,waitUntil=0,fromSettings=false,shownCode="";
function read(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function write(v){try{if(v)localStorage.setItem(KEY,JSON.stringify(v));else localStorage.removeItem(KEY)}catch(e){}}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return("0"+b.toString(16)).slice(-2)}).join("")}
function salt(){var a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a.buffer)}
function derive(pw,s){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"])
    .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(s),iterations:150000,hash:"SHA-256"},k,256)}).then(hex);
}
function newCode(){var A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=new Uint8Array(12),s="";crypto.getRandomValues(a);for(var i=0;i<12;i++){s+=A[a[i]%A.length];if(i===3||i===7)s+="-"}return s}
function normCode(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function verify(pw){if(!cfg)return Promise.resolve(false);return derive(pw,cfg.salt).then(function(h){return h===cfg.hash})}
function store(pw){
  var s=salt(),rs=salt(),code=newCode(),after=cfg&&cfg.after!=null?cfg.after:5;
  return Promise.all([derive(pw,s),derive(normCode(code),rs)]).then(function(h){cfg={salt:s,hash:h[0],rsalt:rs,rhash:h[1],after:after};write(cfg);return code});
}
var ICON='<img class="lkicon" src="icon-180.png" alt="">';
function frame(inner){box.innerHTML='<div class="lk">'+ICON+inner+'</div>';bind()}
function show(m){
  mode=m;root.classList.add("is-locked");box.hidden=false;
  if(m==="create")frame('<h1 id="lkTitle">Set a password</h1><p class="muted" style="margin-top:8px">You will need it every time you open the app. Your iPhone can save it and fill it in with Face ID.</p>'+
      '<input type="text" autocomplete="username" value="wortwerk" style="display:none" aria-hidden="true" tabindex="-1">'+
      '<label for="lkA">Password (at least 4 characters)</label><input type="password" id="lkA" autocomplete="new-password">'+
      '<label for="lkB">Repeat password</label><input type="password" id="lkB" autocomplete="new-password">'+
      '<p class="lkerr" id="lkErr"></p><button class="btn primary block" id="lkGo">Set password</button>'+(fromSettings?'<button class="btn ghost block" id="lkCancel" style="margin-top:8px">Cancel</button>':''));
  else if(m==="code")frame('<h1 id="lkTitle">Your recovery code</h1><p class="muted" style="margin-top:8px">If you ever forget your password, this code lets you set a new one <b>without losing your progress</b>. Save it now, for example in Notes or a screenshot.</p>'+
      '<div class="code">'+shownCode+'</div><p class="lkerr" id="lkErr"></p><button class="btn primary block" id="lkGo">I saved the code</button>');
  else if(m==="recover")frame('<h1 id="lkTitle">Forgot your password?</h1><p class="muted" style="margin-top:8px">Enter your recovery code. Then you can set a new password and keep all your progress.</p>'+
      '<label for="lkA">Recovery code</label><input type="text" id="lkA" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-EFGH-JKLM">'+
      '<p class="lkerr" id="lkErr"></p><button class="btn primary block" id="lkGo">Continue</button><button class="btn ghost block" id="lkBack" style="margin-top:8px">Back</button>'+
      '<button class="btn ghost block" id="lkErase" style="margin-top:18px;color:var(--bad)">I have no code: erase everything</button>');
  else frame('<h1 id="lkTitle">Welcome back</h1><p class="muted" style="margin-top:8px">Enter your password to open the app.</p>'+
      '<input type="text" autocomplete="username" value="wortwerk" style="display:none" aria-hidden="true" tabindex="-1">'+
      '<label for="lkA">Password</label><input type="password" id="lkA" autocomplete="current-password">'+
      '<p class="lkerr" id="lkErr"></p><button class="btn primary block" id="lkGo">Unlock</button>'+
      '<button class="btn ghost block" id="lkForgot" style="margin-top:8px">Forgot password?</button>');
}
function hide(){box.hidden=true;box.innerHTML="";root.classList.remove("is-locked");mode=null;fromSettings=false;shownCode="";if(window.__lockChanged)window.__lockChanged()}
function err(t){var e=document.getElementById("lkErr");if(e){e.textContent=t;var b=box.querySelector(".lk");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}}
function on(id,f){var e=document.getElementById(id);if(e)e.addEventListener("click",f)}
function bind(){
  on("lkGo",submit);on("lkCancel",hide);on("lkForgot",function(){if(cfg&&cfg.rhash)show("recover");else eraseAll()});
  on("lkBack",function(){show("unlock")});on("lkErase",eraseAll);
  ["lkA","lkB"].forEach(function(id){var i=document.getElementById(id);if(i)i.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit()}})});
}
function eraseAll(){
  if(!confirm("Erase everything?\n\nThis deletes ALL data on this phone: words, progress and streak. It cannot be undone."))return;
  try{Object.keys(localStorage).filter(function(k){return k.indexOf("swap.")===0||k.indexOf("ww.")===0}).forEach(function(k){localStorage.removeItem(k)})}catch(e){}
  location.reload();
}
function submit(){
  var a=(document.getElementById("lkA")||{}).value||"",b=(document.getElementById("lkB")||{}).value||"";
  if(mode==="code"){hide();return}
  if(mode==="create"){
    if(a.length<4)return err("Use at least 4 characters.");
    if(a!==b)return err("The two passwords are different.");
    store(a).then(function(code){shownCode=code;show("code")}).catch(function(){err("Could not save the password here.")});
    return;
  }
  if(mode==="recover"){
    if(!cfg||!cfg.rhash)return err("No recovery code is set.");
    derive(normCode(a),cfg.rsalt).then(function(h){if(h===cfg.rhash){fromSettings=false;show("create")}else err("This code is not correct.")});
    return;
  }
  if(Date.now()<waitUntil)return err("Too many tries. Wait "+Math.ceil((waitUntil-Date.now())/1000)+" seconds.");
  verify(a).then(function(ok){
    if(ok){fails=0;hide()}
    else{fails++;if(fails>=5){waitUntil=Date.now()+30000;fails=0;err("Wrong password. Wait 30 seconds.")}else err("Wrong password.")}
  }).catch(function(){err("Could not check the password here.")});
}
document.addEventListener("visibilitychange",function(){
  try{
    if(document.hidden){localStorage.setItem(HID,String(Date.now()));return}
    if(!cfg||mode)return;
    var t=+localStorage.getItem(HID)||0;
    if(t&&Date.now()-t>=(cfg.after||0)*60000)show("unlock");
  }catch(e){}
});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="lkAfter"&&cfg){cfg.after=parseInt(e.target.value,10)||0;write(cfg)}});
window.__lock={
  enabled:function(){return !!cfg},
  hasRecovery:function(){return !!(cfg&&cfg.rhash)},
  after:function(){return cfg?cfg.after:5},
  lockNow:function(){if(cfg)show("unlock")},
  create:function(){fromSettings=true;show("create")},
  change:function(cur,nw){return verify(cur).then(function(ok){if(!ok)return false;return store(nw).then(function(code){shownCode=code;show("code");return true})})},
  disable:function(cur){return verify(cur).then(function(ok){if(ok){cfg=null;write(null)}return ok})}
};
if(!(window.crypto&&crypto.subtle)){window.__lock=null;return}
if(cfg)show("unlock");else show("create");
})();
</script>

<script>

{ch:"A1-7",t:"Ein Tag im Büro",s:[["Frau Weber kommt um acht Uhr ins Büro.","Ms. Weber comes to the office at eight."],["Zuerst liest sie ihre E-Mails.","First she reads her emails."],["Um zehn Uhr hat sie eine Besprechung mit dem Chef.","At ten she has a meeting with the boss."],["Danach telefoniert sie mit einem Kunden.","After that she talks to a customer on the phone."],["In der Mittagspause geht sie mit einer Kollegin in die Kantine.","At lunch break she goes to the canteen with a colleague."],["Am Nachmittag ist der Drucker kaputt, aber ein Kollege hilft ihr.","In the afternoon the printer is broken, but a colleague helps her."]],

{ch:"A1-7",t:"Eine E-Mail an die Kollegen",s:[["Liebe Kolleginnen und Kollegen,","Dear colleagues,"],["am Donnerstag haben wir um 14 Uhr eine Besprechung in Raum 2.","on Thursday at 2 pm we have a meeting in room 2."],["Bitte bringen Sie Ihre Ideen für das neue Projekt mit.","Please bring your ideas for the new project."],["Der Drucker im Büro ist leider kaputt, aber der Drucker in der Küche funktioniert.","Unfortunately the printer in the office is broken, but the printer in the kitchen works."],["Viele Grüße, Thomas Becker","Best regards, Thomas Becker"]],
 q:["Wann ist die Besprechung?|Am Donnerstag um 14 Uhr|Am Dienstag um 14 Uhr|Am Donnerstag um 4 Uhr","Was sollen die Kollegen mitbringen?|Ideen für das neue Projekt|Einen Kuchen|Einen Drucker","Welcher Drucker funktioniert?|Der Drucker in der Küche|Der Drucker im Büro|Keiner"]},
{ch:"A1-8",t:"Beim Arzt",s:[["Max ist krank.","Max is sick."],["Er hat Kopfschmerzen, Husten und Fieber.","He has a headache, a cough and a fever."],["Er geht zum Arzt.","He goes to the doctor."],["Der Arzt sagt: „Sie haben eine Erkältung.“","The doctor says: 'You have a cold.'"],["„Bleiben Sie drei Tage im Bett und trinken Sie viel Tee.“","'Stay in bed for three days and drink lots of tea.'"],["„Nehmen Sie diese Tabletten zweimal am Tag. Sie dürfen keinen Sport machen.“","'Take these tablets twice a day. You're not allowed to do sports.'"]],
 q:["Was hat Max?|Eine Erkältung|Einen Unfall|Bauchschmerzen","Wie lange soll er im Bett bleiben?|Drei Tage|Zwei Tage|Eine Woche","Was darf Max nicht machen?|Sport|Tee trinken|Tabletten nehmen"]},
{ch:"A1-8",t:"Gesund leben",s:[["Was kann man für die Gesundheit tun?","What can you do for your health?"],["Trink jeden Tag viel Wasser und iss mehr Obst und Gemüse.","Drink a lot of water every day and eat more fruit and vegetables."],["Geh oft zu Fuß oder fahr mit dem Fahrrad.","Walk often or ride your bike."],["Du sollst nicht zu lange vor dem Computer sitzen.","You shouldn't sit in front of the computer for too long."],["Und schlaf genug: sieben bis acht Stunden sind gut.","And sleep enough: seven to eight hours are good."]],
 q:["Was soll man jeden Tag trinken?|Viel Wasser|Viel Kaffee|Viel Saft","Wie lange soll man schlafen?|Sieben bis acht Stunden|Fünf Stunden|Zehn Stunden","Was soll man nicht machen?|Zu lange vor dem Computer sitzen|Fahrrad fahren|Obst essen"]},
{ch:"A1-9",t:"Unsere neue Wohnung",s:[["Wir haben eine neue Wohnung!","We have a new apartment!"],["Sie hat drei Zimmer, eine Küche und ein Bad.","It has three rooms, a kitchen and a bathroom."],["Das Wohnzimmer ist groß und hell, und es hat einen Balkon.","The living room is big and bright, and it has a balcony."],["Im Schlafzimmer steht ein großes Bett.","There's a big bed in the bedroom."],["Die Küche ist leider klein.","Unfortunately the kitchen is small."],["Die Miete ist nicht billig, aber die Wohnung liegt sehr zentral.","The rent isn't cheap, but the apartment is very central."]],
 q:["Wie viele Zimmer hat die Wohnung?|Drei|Zwei|Vier","Welches Zimmer ist klein?|Die Küche|Das Wohnzimmer|Das Schlafzimmer","Was ist nicht billig?|Die Miete|Das Bett|Der Balkon"]},
{ch:"A1-9",t:"Wohnung zu vermieten",s:[["Schöne 2-Zimmer-Wohnung in Freiburg, 55 Quadratmeter.","Nice two-room apartment in Freiburg, 55 square metres."],["Die Wohnung hat eine neue Küche, ein Bad mit Fenster und einen Balkon.","The apartment has a new kitchen, a bathroom with a window and a balcony."],["Das Schlafzimmer ist ruhig, das Wohnzimmer ist hell.","The bedroom is quiet; the living room is bright."],["Die Miete kostet 650 Euro im Monat.","The rent is 650 euros a month."],["Haustiere sind leider nicht erlaubt.","Unfortunately, pets are not allowed."]],
 q:["Wie groß ist die Wohnung?|55 Quadratmeter|65 Quadratmeter|25 Quadratmeter","Was kostet die Miete?|650 Euro im Monat|550 Euro im Monat|650 Euro in der Woche","Was ist nicht erlaubt?|Haustiere|Kinder|Partys"]},
{ch:"A1-10",t:"Neu im Job",s:[["Ich heiße Ahmet und habe in Stuttgart Maschinenbau studiert.","My name is Ahmet and I studied mechanical engineering in Stuttgart."],["Nach dem Studium habe ich ein Praktikum bei einer Firma gemacht.","After my studies I did an internship at a company."],["Dann habe ich viele Bewerbungen geschrieben.","Then I wrote a lot of applications."],["Letzten Monat habe ich endlich eine Stelle gefunden.","Last month I finally found a job."],["Jetzt arbeite ich als Ingenieur und bin sehr zufrieden.","Now I work as an engineer and I'm very satisfied."]],
 q:["Was hat Ahmet studiert?|Maschinenbau|Medizin|Informatik","Was hat er nach dem Studium gemacht?|Ein Praktikum|Eine Reise|Eine Ausbildung","Wann hat er die Stelle gefunden?|Letzten Monat|Letztes Jahr|Gestern"]},
{ch:"A1-10",t:"Mein Arbeitstag",s:[["Gestern bin ich um sechs Uhr aufgestanden.","Yesterday I got up at six."],["Ich habe schnell gefrühstückt und bin mit dem Zug zur Arbeit gefahren.","I had a quick breakfast and took the train to work."],["Am Vormittag habe ich mit meinem Team einen Roboter getestet.","In the morning I tested a robot with my team."],["Am Nachmittag hatte ich zwei Besprechungen.","In the afternoon I had two meetings."],["Um sieben Uhr war ich endlich zu Hause und habe Pizza bestellt.","At seven I was finally home and ordered pizza."]],
 q:["Wann ist die Person aufgestanden?|Um sechs Uhr|Um sieben Uhr|Um acht Uhr","Wie ist sie zur Arbeit gefahren?|Mit dem Zug|Mit dem Auto|Mit dem Fahrrad","Was hat sie am Abend gemacht?|Sie hat Pizza bestellt.|Sie hat gekocht.|Sie hat gearbeitet."]},
{ch:"A1-11",t:"Im Kaufhaus",s:[["Julia sucht eine Jacke für den Winter.","Julia is looking for a jacket for the winter."],["Im Kaufhaus findet sie zwei Jacken: eine schwarze und eine rote.","In the department store she finds two jackets: a black one and a red one."],["Sie probiert beide an.","She tries both on."],["Die schwarze Jacke ist zu groß.","The black jacket is too big."],["Die rote passt ihr gut und gefällt ihr sehr.","The red one fits her well and she likes it a lot."],["Sie kostet 89 Euro. Julia kauft sie.","It costs 89 euros. Julia buys it."]],
 q:["Was sucht Julia?|Eine Jacke|Einen Pullover|Schuhe","Warum kauft sie die schwarze Jacke nicht?|Sie ist zu groß.|Sie ist zu teuer.|Sie gefällt ihr nicht.","Was kostet die rote Jacke?|89 Euro|98 Euro|19 Euro"]},
{ch:"A1-11",t:"Das passende Hemd",s:[["Verkäuferin: Kann ich Ihnen helfen?","Saleswoman: Can I help you?"],["Kunde: Ja, ich suche ein Hemd für eine Hochzeit.","Customer: Yes, I'm looking for a shirt for a wedding."],["Verkäuferin: Welche Größe haben Sie? Dieses Hemd hier ist sehr elegant.","Saleswoman: What size are you? This shirt here is very elegant."],["Kunde: Größe M. Die Farbe gefällt mir, aber das Hemd ist zu eng.","Customer: Size M. I like the colour, but the shirt is too tight."],["Verkäuferin: Probieren Sie doch Größe L an!","Saleswoman: Why don't you try on size L!"]],
 q:["Was sucht der Kunde?|Ein Hemd|Eine Jacke|Schuhe","Was ist das Problem?|Das Hemd ist zu eng.|Die Farbe gefällt ihm nicht.|Es ist zu teuer.","Welche Größe soll er anprobieren?|Größe L|Größe M|Größe S"]},
{ch:"A1-12",t:"Eine Postkarte aus Rom",s:[["Liebe Oma, wir sind seit einer Woche in Rom.","Dear Grandma, we've been in Rome for a week."],["Das Wetter ist super, es ist sonnig und warm.","The weather is great; it's sunny and warm."],["Wir haben schon viele Sehenswürdigkeiten besichtigt.","We've already seen lots of sights."],["Gestern waren wir am Meer und sind geschwommen.","Yesterday we were at the sea and went swimming."],["Das Hotel ist klein, aber sehr schön.","The hotel is small but very nice."],["Am Samstag fahren wir zurück. Liebe Grüße, Mia","On Saturday we're going back. Love, Mia"]],
 q:["Wie ist das Wetter?|Sonnig und warm|Kalt und nass|Windig und kühl","Wo waren sie gestern?|Am Meer|Im Museum|In den Bergen","Wann fahren sie zurück?|Am Samstag|Morgen|In einer Woche"]},
{ch:"A1-12",t:"Urlaub an der Ostsee",s:[["Im Sommer fahren wir an die Ostsee.","In summer we're going to the Baltic Sea."],["Die Ostsee liegt im Norden von Deutschland.","The Baltic Sea is in the north of Germany."],["Wir haben ein kleines Hotel direkt am Strand gebucht.","We booked a small hotel right on the beach."],["Bei schönem Wetter schwimmen wir im Meer.","In nice weather we swim in the sea."],["Bei Regen besichtigen wir die alte Stadt und gehen ins Museum.","When it rains we visit the old town and go to the museum."]],
 q:["Wo liegt die Ostsee?|Im Norden von Deutschland|Im Süden von Deutschland|In Österreich","Wo ist das Hotel?|Direkt am Strand|In den Bergen|Am Bahnhof","Was machen sie bei Regen?|Sie besichtigen die Stadt.|Sie schwimmen.|Sie bleiben im Hotel."]},
{ch:"A2-1",t:"Ein Abend im Restaurant",s:[["Letzten Freitag war ich mit meinen Freunden in einem italienischen Restaurant, weil Annas Geburtstag war.","Last Friday I was at an Italian restaurant with my friends because it was Anna's birthday."],["Der Kellner war sehr freundlich und hat uns die Pizza empfohlen.","The waiter was very friendly and recommended the pizza to us."],["Als Vorspeise haben wir eine Suppe gegessen.","As a starter we had soup."],["Zum Nachtisch gab es Eis.","For dessert there was ice cream."],["Am Ende haben wir zusammen bezahlt und ein gutes Trinkgeld gegeben.","At the end we paid together and gave a good tip."]],
 q:["Warum waren sie im Restaurant?|Weil Anna Geburtstag hatte.|Weil sie großen Hunger hatten.|Weil der Kellner ein Freund ist.","Was hat der Kellner empfohlen?|Die Pizza|Die Suppe|Das Eis","Was gab es zum Nachtisch?|Eis|Kuchen|Obst"]},
{ch:"A2-1",t:"Mein Hobby: Kochen",s:[["Seit drei Jahren koche ich in meiner Freizeit sehr gern.","For three years I've really enjoyed cooking in my free time."],["Am Wochenende lade ich oft Freunde ein, weil ich nicht allein essen möchte.","On weekends I often invite friends because I don't want to eat alone."],["Letzten Samstag habe ich ein türkisches Menü gekocht.","Last Saturday I cooked a Turkish menu."],["Als Vorspeise gab es Linsensuppe, und zum Nachtisch habe ich Baklava gemacht.","As a starter there was lentil soup, and for dessert I made baklava."],["Meine Gäste waren begeistert und wollten alle Rezepte haben.","My guests were thrilled and wanted all the recipes."]],
 q:["Warum lädt die Person oft Freunde ein?|Weil sie nicht allein essen möchte.|Weil sie ein Restaurant hat.|Weil sie Geburtstag hat.","Was gab es als Vorspeise?|Linsensuppe|Baklava|Salat","Was wollten die Gäste haben?|Die Rezepte|Mehr Suppe|Ein Taxi"]},
{ch:"A2-2",t:"Meine Schulzeit",s:[["In der Grundschule war ich eine gute Schülerin.","In primary school I was a good pupil."],["Mathe war mein Lieblingsfach, aber Sport mochte ich nicht.","Maths was my favourite subject, but I didn't like PE."],["Auf dem Gymnasium musste ich viel lernen, weil die Lehrer streng waren.","At secondary school I had to study a lot because the teachers were strict."],["Ich durfte am Wochenende nicht lange weggehen.","I wasn't allowed to stay out late on weekends."],["Nach dem Abitur wollte ich zuerst Ärztin werden, aber dann habe ich Informatik studiert.","After the Abitur I first wanted to become a doctor, but then I studied computer science."]],
 q:["Was war ihr Lieblingsfach?|Mathe|Sport|Deutsch","Warum musste sie viel lernen?|Weil die Lehrer streng waren.|Weil sie schlechte Noten hatte.|Weil sie Ärztin werden wollte.","Was hat sie studiert?|Informatik|Medizin|Mathematik"]},
{ch:"A2-2",t:"Schulen in Deutschland",s:[["In Deutschland gehen die Kinder vier Jahre in die Grundschule.","In Germany children go to primary school for four years."],["Danach gibt es verschiedene Schulen: die Hauptschule, die Realschule und das Gymnasium.","After that there are different schools: the Hauptschule, the Realschule and the Gymnasium."],["Nach dem Gymnasium macht man das Abitur.","After the Gymnasium you take the Abitur."],["Mit dem Abitur kann man an einer Universität studieren.","With the Abitur you can study at a university."],["Viele junge Leute machen aber auch eine Ausbildung und lernen einen Beruf.","But many young people also do vocational training and learn a trade."]],
 q:["Wie lange geht man in die Grundschule?|Vier Jahre|Sechs Jahre|Zwei Jahre","Was macht man nach dem Gymnasium?|Das Abitur|Die Grundschule|Eine Pause","Was machen viele junge Leute auch?|Eine Ausbildung|Eine Weltreise|Ein Praktikum in der Schule"]},
{ch:"A2-3",t:"Handy oder Buch?",s:[["Viele Jugendliche verbringen heute mehr Zeit am Handy als mit Büchern.","Today many young people spend more time on their phones than with books."],["Ein Handy ist praktischer als ein Buch, weil man immer online ist.","A phone is more practical than a book because you're always online."],["Aber Lesen ist oft besser für die Konzentration.","But reading is often better for concentration."],["Eine Studie sagt, dass Jugendliche am Abend am längsten online sind.","A study says that young people are online longest in the evening."],["Ich finde, dass beides wichtig ist, aber man sollte das Handy am Abend weglegen.","I think both are important, but you should put your phone away in the evening."]],
 q:["Warum ist ein Handy praktischer?|Weil man immer online ist.|Weil es billiger ist.|Weil es besser für die Konzentration ist.","Wann sind Jugendliche am längsten online?|Am Abend|Am Morgen|In der Schule","Was ist oft besser für die Konzentration?|Lesen|Online sein|Fernsehen"]},
{ch:"A2-3",t:"Ein Filmabend",s:[["Gestern haben wir zu Hause einen Filmabend gemacht.","Yesterday we had a movie night at home."],["Mein Freund wollte eine Komödie sehen, aber ich finde Krimis spannender.","My boyfriend wanted to watch a comedy, but I find crime films more exciting."],["Am Ende haben wir einen Krimi gesehen, der in Berlin spielt.","In the end we watched a crime film that is set in Berlin."],["Der Film war besser als die Serie, die wir letzte Woche gesehen haben.","The film was better than the series we watched last week."],["Ich glaube, dass wir nächste Woche ins Kino gehen.","I think we'll go to the cinema next week."]],
 q:["Was wollte der Freund sehen?|Eine Komödie|Einen Krimi|Eine Serie","Wo spielt der Krimi?|In Berlin|In Hamburg|In München","Was machen sie nächste Woche vielleicht?|Sie gehen ins Kino.|Sie sehen eine Serie.|Sie machen einen Filmabend."]},
{ch:"A2-4",t:"Eine Hochzeit im Norden",s:[["Am Wochenende war ich auf der Hochzeit von meiner Cousine in Kiel.","On the weekend I was at my cousin's wedding in Kiel."],["Ich habe mich sehr gefreut, weil ich die ganze Familie wiedergesehen habe.","I was very happy because I saw the whole family again."],["Wenn bei uns jemand heiratet, feiern wir immer bis spät in die Nacht.","When someone in our family gets married, we always celebrate until late at night."],["Leider hat es den ganzen Tag geregnet.","Unfortunately it rained all day."],["Trotzdem war das Fest wunderschön, und alle haben getanzt.","Still, the celebration was wonderful, and everyone danced."]],
 q:["Wo war die Hochzeit?|In Kiel|In Hamburg|In München","Warum hat sich die Person gefreut?|Sie hat die Familie wiedergesehen.|Das Wetter war schön.|Sie hat selbst geheiratet.","Wie war das Wetter?|Es hat geregnet.|Es war sonnig.|Es hat geschneit."]},
{ch:"A2-4",t:"Danke für alles!",s:[["Liebe Maria, vielen Dank für die tolle Geburtstagsparty!","Dear Maria, thank you so much for the great birthday party!"],["Ich habe mich sehr über dein Geschenk gefreut.","I was very happy about your present."],["Wenn ich das Buch lese, denke ich immer an dich.","When I read the book, I always think of you."],["Leider musste ich früh nach Hause gehen, weil ich am nächsten Tag arbeiten musste.","Unfortunately I had to go home early because I had to work the next day."],["Nächstes Jahr feiern wir zusammen bis zum Morgen! Liebe Grüße, Sophie","Next year we'll celebrate together until morning! Love, Sophie"]],
 q:["Worüber hat sich Sophie gefreut?|Über das Geschenk|Über das Wetter|Über den Urlaub","Was macht Sophie, wenn sie das Buch liest?|Sie denkt an Maria.|Sie schläft ein.|Sie lernt Deutsch.","Warum musste sie früh gehen?|Sie musste am nächsten Tag arbeiten.|Sie war krank.|Sie hatte keine Lust."]},
{ch:"A2-5",t:"Auf dem Amt",s:[["Herr Kaya ist vor einem Monat nach Karlsruhe gezogen.","Mr. Kaya moved to Karlsruhe a month ago."],["Heute muss er zum Bürgeramt, weil er sich anmelden muss.","Today he has to go to the citizens' office because he has to register."],["Er hat einen Termin um 9 Uhr.","He has an appointment at 9."],["Die Mitarbeiterin ist sehr freundlich: „Könnten Sie bitte dieses Formular ausfüllen und hier unterschreiben?“","The clerk is very friendly: 'Could you please fill out this form and sign here?'"],["Herr Kaya braucht auch seinen Pass und den Mietvertrag.","Mr. Kaya also needs his passport and the rental contract."],["Nach zwanzig Minuten ist alles fertig.","After twenty minutes everything is done."]],
 q:["Warum geht Herr Kaya zum Bürgeramt?|Er muss sich anmelden.|Er braucht einen neuen Pass.|Er sucht eine Wohnung.","Was muss er ausfüllen?|Ein Formular|Einen Lebenslauf|Eine Bewerbung","Wie lange dauert es?|Zwanzig Minuten|Eine Stunde|Neun Minuten"]},
{ch:"A2-5",t:"Das Vorstellungsgespräch",s:[["Frau Novak hat heute ein Vorstellungsgespräch bei einer Bank.","Ms. Novak has a job interview at a bank today."],["Sie trägt eine dunkle Jacke und ist ein bisschen nervös.","She is wearing a dark jacket and is a little nervous."],["Der Chef fragt: „Warum möchten Sie bei uns arbeiten?“","The boss asks: 'Why would you like to work for us?'"],["Sie antwortet, dass sie gern mit Menschen arbeitet und gut rechnen kann.","She answers that she likes working with people and is good with numbers."],["Am Ende sagt der Chef: „Könnten Sie schon nächsten Monat anfangen?“","At the end the boss says: 'Could you start as early as next month?'"]],
 q:["Wo hat Frau Novak ein Vorstellungsgespräch?|Bei einer Bank|In einem Hotel|Auf dem Amt","Was trägt sie?|Eine dunkle Jacke|Ein rotes Kleid|Einen Pullover","Wann könnte sie anfangen?|Nächsten Monat|Morgen|Nächstes Jahr"]},
{ch:"A2-6",t:"Am Telefon",s:[["Sarah Lindner arbeitet bei der Firma Techno.","Sarah Lindner works at the company Techno."],["Heute ruft sie Herrn Müller an, weil sie eine Frage zu seinem Angebot hat.","Today she calls Mr. Müller because she has a question about his offer."],["Leider ist Herr Müller nicht im Büro.","Unfortunately Mr. Müller isn't in the office."],["Deshalb spricht sie auf den Anrufbeantworter: „Könnten Sie mich bitte morgen zurückrufen? Ich werde ab neun Uhr im Büro sein.“","So she leaves a message on the answering machine: 'Could you please call me back tomorrow? I'll be in the office from nine.'"]],
 q:["Warum ruft Sarah an?|Sie hat eine Frage zum Angebot.|Sie möchte einen Termin absagen.|Sie sucht eine neue Stelle.","Warum spricht sie auf den Anrufbeantworter?|Herr Müller ist nicht im Büro.|Das Telefon ist kaputt.|Sie hat keine Zeit.","Wann ist Sarah morgen im Büro?|Ab neun Uhr|Bis neun Uhr|Ab zehn Uhr"]},
{ch:"A2-6",t:"Eine Bahnreise",s:[["Am Freitag fahre ich mit dem Zug von Stuttgart nach Hamburg.","On Friday I'm taking the train from Stuttgart to Hamburg."],["Die Fahrkarte habe ich online gekauft, weil sie dort günstiger war.","I bought the ticket online because it was cheaper there."],["Leider gibt es keine direkte Verbindung, ich muss in Frankfurt umsteigen.","Unfortunately there's no direct connection; I have to change in Frankfurt."],["Der Zug fährt um 9:15 Uhr von Gleis 8 ab.","The train leaves from platform 8 at 9:15."],["Ich werde ungefähr um 15 Uhr in Hamburg ankommen.","I'll arrive in Hamburg at about 3 pm."]],
 q:["Warum hat die Person online gekauft?|Weil es günstiger war.|Weil der Schalter zu war.|Weil es schneller war.","Wo muss sie umsteigen?|In Frankfurt|In Hamburg|In Stuttgart","Wann kommt sie in Hamburg an?|Um ungefähr 15 Uhr|Um 9:15 Uhr|Um 8 Uhr"]},
{ch:"A2-7",t:"Mein Weg zur Arbeit",s:[["Ich wohne in Ettlingen und arbeite in Karlsruhe.","I live in Ettlingen and work in Karlsruhe."],["Früher bin ich mit dem Auto gefahren, aber morgens gab es immer Stau.","I used to drive, but there was always a traffic jam in the mornings."],["Jetzt fahre ich mit der Straßenbahn.","Now I take the tram."],["Die Fahrt dauert 25 Minuten.","The trip takes 25 minutes."],["Das ist zwar länger als mit dem Auto ohne Stau, aber ich kann in der Bahn lesen.","That's longer than by car without traffic, but I can read on the tram."]],
 q:["Warum fährt die Person nicht mehr mit dem Auto?|Weil es morgens immer Stau gab.|Weil das Auto kaputt ist.|Weil Parken zu teuer ist.","Wie lange dauert die Fahrt mit der Straßenbahn?|25 Minuten|15 Minuten|52 Minuten","Was kann die Person in der Bahn machen?|Lesen|Schlafen|Frühstücken"]},
{ch:"A2-7",t:"Mit dem Fahrrad zur Arbeit",s:[["Seit einem Jahr fahre ich jeden Tag mit dem Fahrrad zur Arbeit.","For a year I've been cycling to work every day."],["Die Strecke ist acht Kilometer lang und dauert etwa 30 Minuten.","The route is eight kilometres long and takes about 30 minutes."],["Das ist gut für die Gesundheit, und ich stehe nie im Stau.","That's good for my health, and I'm never stuck in traffic."],["Bei starkem Regen nehme ich aber die Straßenbahn.","In heavy rain, though, I take the tram."],["Können Sie mir sagen, wo man hier ein gutes Fahrrad kaufen kann?","Can you tell me where you can buy a good bike here?"]],
 q:["Wie lang ist die Strecke?|Acht Kilometer|30 Kilometer|Drei Kilometer","Was nimmt die Person bei starkem Regen?|Die Straßenbahn|Das Auto|Ein Taxi","Was ist ein Vorteil?|Sie steht nie im Stau.|Es ist billiger als Laufen.|Sie kann dabei schlafen."]},
{ch:"A2-8",t:"Tipps zum Lernen",s:[["Viele Leute haben Probleme beim Wörterlernen.","Many people have problems learning vocabulary."],["Hier sind ein paar Ratschläge: Du solltest jeden Tag ein bisschen lernen und nicht einmal pro Woche sehr viel.","Here are a few tips: you should learn a little every day and not a lot once a week."],["Du solltest neue Wörter laut sagen und in Sätzen benutzen.","You should say new words out loud and use them in sentences."],["Ein Lernpartner kann auch helfen.","A study partner can also help."],["Vor einer Prüfung solltest du gut schlafen und nicht die ganze Nacht lernen.","Before an exam you should sleep well and not study all night."]],
 q:["Wie oft sollte man lernen?|Jeden Tag ein bisschen|Einmal pro Woche sehr viel|Nur vor der Prüfung","Was sollte man mit neuen Wörtern machen?|Laut sagen und in Sätzen benutzen|Nur leise lesen|Auf einen Zettel schreiben","Was sollte man vor einer Prüfung machen?|Gut schlafen|Die ganze Nacht lernen|Viel Kaffee trinken"]},
{ch:"A2-8",t:"Meine Präsentation",s:[["Nächste Woche muss ich im Deutschkurs eine Präsentation halten.","Next week I have to give a presentation in my German course."],["Mein Thema ist „Roboter im Alltag“.","My topic is 'Robots in everyday life'."],["Meine Lehrerin hat gesagt, ich sollte nicht zu viel Text auf die Folien schreiben.","My teacher said I shouldn't write too much text on the slides."],["Außerdem sollte ich die Präsentation vorher mehrmals laut üben.","Also, I should practise the presentation out loud several times beforehand."],["Was für ein Bild passt gut zum Anfang? Vielleicht ein Foto von einem Roboter in der Küche.","What kind of picture fits well at the beginning? Maybe a photo of a robot in the kitchen."]],
 q:["Was ist das Thema?|Roboter im Alltag|Lernen mit Apps|Reisen in Deutschland","Was sollte die Person nicht machen?|Zu viel Text auf die Folien schreiben|Laut üben|Bilder benutzen","Welches Bild passt vielleicht zum Anfang?|Ein Roboter in der Küche|Ein Klassenzimmer|Ein Strand"]},
{ch:"A2-9",t:"Das Spiel",s:[["Am Samstag hat unsere Mannschaft gegen Freiburg gespielt.","On Saturday our team played against Freiburg."],["Wir waren sehr begeistert, weil wir in der ersten Halbzeit zwei Tore geschossen haben.","We were very excited because we scored two goals in the first half."],["Aber in der zweiten Halbzeit hat Freiburg drei Tore gemacht.","But in the second half Freiburg scored three goals."],["Wir haben verloren, deshalb waren die Fans enttäuscht.","We lost, so the fans were disappointed."],["Trotzdem gehen wir nächste Woche wieder ins Stadion.","We're still going to the stadium again next week."]],
 q:["Wie viele Tore hat Freiburg gemacht?|Drei|Zwei|Eins","Warum waren die Fans enttäuscht?|Weil ihre Mannschaft verloren hat.|Weil das Wetter schlecht war.|Weil es keine Tore gab.","Was machen sie nächste Woche?|Sie gehen wieder ins Stadion.|Sie trainieren selbst.|Sie bleiben zu Hause."]},
{ch:"A2-9",t:"Mein Verein",s:[["Ich spiele seit fünf Jahren in einem Volleyballverein.","I've been playing in a volleyball club for five years."],["Wir trainieren zweimal pro Woche, am Dienstag und am Donnerstag.","We train twice a week, on Tuesday and Thursday."],["Letzten Sonntag hatten wir ein wichtiges Spiel, aber zwei Spielerinnen waren krank.","Last Sunday we had an important match, but two players were sick."],["Trotzdem haben wir gewonnen, deshalb haben wir danach zusammen gefeiert.","We won anyway, so we celebrated together afterwards."],["Komm doch nächste Woche mal zum Training!","Why don't you come to training next week!"]],
 q:["Wie oft trainiert die Mannschaft?|Zweimal pro Woche|Einmal pro Woche|Jeden Tag","Was war das Problem am Sonntag?|Zwei Spielerinnen waren krank.|Es hat geregnet.|Der Trainer war nicht da.","Was haben sie nach dem Spiel gemacht?|Sie haben gefeiert.|Sie haben trainiert.|Sie waren traurig."]},
{ch:"A2-10",t:"Neue Nachbarn",s:[["Seit einem Monat wohnt neben mir eine junge Familie.","A young family has been living next to me for a month."],["Sie haben einen Hund, der am Abend oft bellt.","They have a dog that often barks in the evening."],["Gestern habe ich bei ihnen geklingelt.","Yesterday I rang their doorbell."],["Ich habe freundlich gefragt, ob der Hund am Abend leiser sein kann.","I asked politely whether the dog could be quieter in the evening."],["Die Nachbarin hat sich entschuldigt und mich zum Kaffee eingeladen.","The neighbour apologized and invited me for coffee."],["Jetzt verstehen wir uns sehr gut.","Now we get along very well."]],
 q:["Was ist das Problem?|Der Hund bellt am Abend.|Die Musik ist zu laut.|Die Nachbarn sind unfreundlich.","Was hat die Nachbarin gemacht?|Sie hat sich entschuldigt.|Sie hat sich beschwert.|Sie ist umgezogen.","Wie ist die Situation jetzt?|Sie verstehen sich gut.|Sie sprechen nicht mehr.|Der Hund ist weg."]},
{ch:"A2-10",t:"Unser Hund Bello",s:[["Seit letztem Sommer haben wir einen Hund, er heißt Bello.","Since last summer we've had a dog; his name is Bello."],["Bello schläft am liebsten auf dem Sofa, aber das darf er eigentlich nicht.","Bello likes sleeping on the sofa best, but he isn't actually allowed to."],["Wenn wir nach Hause kommen, liegt er oft unter dem Tisch.","When we come home, he's often lying under the table."],["Gestern hat er meinen Schuh unter das Bett gelegt.","Yesterday he put my shoe under the bed."],["Unsere Nachbarn mögen ihn sehr, sie passen auf ihn auf, wenn wir im Urlaub sind.","Our neighbours like him a lot; they look after him when we're on vacation."]],
 q:["Wo schläft Bello am liebsten?|Auf dem Sofa|Im Garten|Unter dem Bett","Was hat Bello gestern gemacht?|Er hat einen Schuh unter das Bett gelegt.|Er hat die Nachbarn gebissen.|Er ist weggelaufen.","Wer passt im Urlaub auf Bello auf?|Die Nachbarn|Die Großeltern|Ein Hotel"]},
{ch:"A2-11",t:"Wenn ich mehr Zeit hätte",s:[["Ich habe nie genug Zeit.","I never have enough time."],["Wenn ich mehr Zeit hätte, würde ich öfter Sport machen und mehr lesen.","If I had more time, I'd do sports more often and read more."],["Ich würde auch gern ein Instrument lernen, vielleicht Gitarre.","I'd also like to learn an instrument, maybe guitar."],["Mein größter Wunsch wäre eine lange Reise durch Südamerika.","My biggest wish would be a long trip through South America."],["Aber jetzt muss ich arbeiten.","But right now I have to work."],["Ich freue mich schon auf den Urlaub im August.","I'm already looking forward to the vacation in August."]],
 q:["Welches Instrument würde die Person gern lernen?|Gitarre|Klavier|Geige","Was ist ihr größter Wunsch?|Eine Reise durch Südamerika|Mehr Geld|Ein neuer Job","Worauf freut sich die Person?|Auf den Urlaub im August|Auf die Arbeit|Auf das Wochenende"]},
{ch:"A2-11",t:"Pläne für das nächste Jahr",s:[["Nächstes Jahr möchte ich viele Dinge ändern.","Next year I'd like to change many things."],["Ich würde gern weniger Zeit am Handy verbringen und mehr Bücher lesen.","I'd like to spend less time on my phone and read more books."],["Außerdem interessiere ich mich für Fotografie, deshalb plane ich einen Kurs.","I'm also interested in photography, so I'm planning a course."],["Mein größter Traum wäre eine Reise nach Japan.","My biggest dream would be a trip to Japan."],["Wenn ich genug Geld spare, fahre ich im Herbst.","If I save enough money, I'll go in autumn."]],
 q:["Wofür interessiert sich die Person?|Für Fotografie|Für Fußball|Für Musik","Was wäre ihr größter Traum?|Eine Reise nach Japan|Ein neues Handy|Ein Haus am Meer","Wann möchte sie fahren?|Im Herbst|Im Sommer|Im Winter"]},
{ch:"A2-12",t:"Ein Bild beschreiben",s:[["Auf dem Bild sieht man ein Schloss, das auf einem Berg steht.","In the picture you can see a castle standing on a mountain."],["Im Vordergrund ist ein kleiner See.","In the foreground there's a small lake."],["Im Hintergrund sieht man hohe Berge mit Schnee.","In the background you can see high mountains with snow."],["Der Himmel ist blau, und es gibt nur ein paar Wolken.","The sky is blue, and there are only a few clouds."],["Das Bild hat ein bekannter Maler gemalt, den ich sehr mag.","A famous painter whom I like very much painted the picture."],["Mir gefällt das Bild, weil es so ruhig wirkt.","I like the picture because it seems so calm."]],
 q:["Was steht auf dem Berg?|Ein Schloss|Eine Kirche|Ein Hotel","Was ist im Vordergrund?|Ein kleiner See|Hohe Berge|Ein Wald","Warum gefällt der Person das Bild?|Weil es so ruhig wirkt.|Weil es sehr bunt ist.|Weil es teuer war."]},
{ch:"A2-12",t:"Ein Konzertbesuch",s:[["Gestern Abend war ich mit meiner Schwester auf einem Konzert.","Last night I was at a concert with my sister."],["Die Band, die wir gesehen haben, kommt aus Wien.","The band we saw comes from Vienna."],["Der Sänger hatte eine tolle Stimme, und das Publikum hat die ganze Zeit getanzt.","The singer had a great voice, and the audience danced the whole time."],["Am besten hat mir ein ruhiges Lied mit Gitarre gefallen.","I liked a calm song with guitar best."],["Die Eintrittskarten waren nicht billig, aber der Abend war wunderbar.","The tickets weren't cheap, but the evening was wonderful."]],

{id:"arzttermin",cat:"life",e:"📞",h:155,lv:"A1",t:"Call the doctor",de:"Einen Arzttermin machen",goal:"You feel sick. Call the practice and get an appointment.",roles:{A:"Practice",B:"You"},
 d:["A|Praxis Dr. Schmidt, guten Tag.|Dr. Schmidt's practice, hello.","B|Guten Tag, mein Name ist Can Yılmaz. Ich brauche einen Termin, bitte.|Hello, my name is Can Yılmaz. I need an appointment, please.","A|Was haben Sie denn?|What's the problem?","B|Ich habe seit drei Tagen Halsschmerzen und Fieber.|I've had a sore throat and a fever for three days.","A|Können Sie heute um 15 Uhr kommen?|Can you come today at 3 pm?","B|Ja, das passt gut.|Yes, that works well.","A|Bringen Sie bitte Ihre Versichertenkarte mit.|Please bring your health insurance card.","B|Mache ich. Vielen Dank, bis später!|Will do. Thank you, see you later!"],

{id:"apotheke",cat:"life",e:"💊",h:140,lv:"A1",t:"At the pharmacy",de:"In der Apotheke",goal:"You have a headache. Get something at the pharmacy.",roles:{A:"Pharmacist",B:"You"},
 d:["A|Guten Tag, was darf es sein?|Hello, what can I get you?","B|Guten Tag. Ich habe Kopfschmerzen. Haben Sie etwas dagegen?|Hello. I have a headache. Do you have something for it?","A|Ja, diese Tabletten hier. Nehmen Sie zweimal am Tag eine Tablette.|Yes, these tablets. Take one tablet twice a day.","B|Vor oder nach dem Essen?|Before or after meals?","A|Nach dem Essen, mit viel Wasser.|After meals, with lots of water.","B|Gut. Was kostet das?|OK. How much is it?","A|Das macht 6,50 Euro. Gute Besserung!|That's 6.50 euros. Get well soon!"],

 d:["A|Guten Morgen! Was darf's sein?|Good morning! What would you like?","B|Guten Morgen. Ich hätte gern vier Brötchen, bitte.|Good morning. I'd like four bread rolls, please.","A|Gern. Noch etwas?|Sure. Anything else?","B|Ja, ein Stück Apfelkuchen. Ist der frisch?|Yes, a piece of apple cake. Is it fresh?","A|Ja, von heute Morgen. Sonst noch etwas?|Yes, from this morning. Anything else?","B|Nein, danke. Das ist alles. Kann ich mit Karte zahlen?|No, thanks. That's all. Can I pay by card?","A|Ja, natürlich. Das macht 5,20 Euro.|Yes, of course. That's 5.20 euros.","B|Bitte schön. Schönen Tag noch!|Here you go. Have a nice day!"],

 d:["B|Guten Tag. Ich möchte dieses Paket in die Türkei schicken.|Hello. I'd like to send this parcel to Turkey.","A|Gern. Was ist im Paket?|Sure. What's in the parcel?","B|Kleidung und ein paar Bücher.|Clothes and a few books.","A|Dann füllen Sie bitte dieses Formular aus.|Then please fill out this form.","B|Wie lange dauert das?|How long does it take?","A|Ungefähr eine Woche. Das kostet 24 Euro.|About a week. That costs 24 euros.","B|Gut. Und ich möchte noch fünf Briefmarken, bitte.|OK. And I'd also like five stamps, please.","A|Hier, bitte. Zusammen 28,25 Euro.|Here you are. That's 28.25 euros altogether."],

{id:"bahn",cat:"life",e:"🚆",h:200,lv:"A2",t:"Train ticket and delays",de:"Am Bahnhof",goal:"Buy a ticket to Munich — and deal with a delay.",roles:{A:"Ticket office",B:"You",N:"Announcement"},
 d:["B|Entschuldigung, ich möchte nach München. Wann fährt der nächste Zug?|Excuse me, I'd like to go to Munich. When does the next train leave?","A|Um 14:05 Uhr von Gleis 3. Sie müssen in Stuttgart umsteigen.|At 2:05 pm from platform 3. You have to change in Stuttgart.","B|Was kostet eine Fahrkarte?|How much is a ticket?","A|Einfach oder hin und zurück?|One way or return?","B|Nur einfach, bitte. Zweite Klasse.|Just one way, please. Second class.","A|Das macht 59 Euro.|That's 59 euros.","N|Achtung an Gleis 3: Der ICE nach München hat etwa zwanzig Minuten Verspätung.|Attention at platform 3: the ICE to Munich is about twenty minutes late.","B|Oh nein! Bekomme ich dann meinen Anschlusszug in Stuttgart?|Oh no! Will I still make my connecting train in Stuttgart?","A|Wahrscheinlich nicht. Sie können aber den nächsten Zug nehmen.|Probably not. But you can take the next train."],

{id:"besichtigung",cat:"life",e:"🏠",h:330,lv:"A2",t:"Viewing a flat",de:"Wohnungsbesichtigung",goal:"You view a flat. Ask about rent, deposit and pets.",roles:{A:"Landlord",B:"You"},
 d:["A|Herzlich willkommen! Kommen Sie rein.|Welcome! Come in.","B|Danke. Die Wohnung ist wirklich hell. Wie groß ist sie?|Thanks. The flat is really bright. How big is it?","A|62 Quadratmeter, zwei Zimmer, Küche und Bad.|62 square metres, two rooms, kitchen and bathroom.","B|Wie hoch ist die Miete?|How much is the rent?","A|780 Euro warm, also mit Nebenkosten. Die Kaution ist drei Monatsmieten.|780 euros including utilities. The deposit is three months' rent.","B|Ab wann ist die Wohnung frei?|From when is the flat available?","A|Ab dem ersten Dezember.|From the first of December.","B|Darf ich ein Haustier haben? Ich habe eine Katze.|May I have a pet? I have a cat.","A|Eine Katze ist kein Problem.|A cat is no problem.","B|Super. Ich bin sehr interessiert. Was brauchen Sie von mir?|Great. I'm very interested. What do you need from me?"],
 p:["Wie hoch ist die Miete?|How much is the rent?","Sind die Nebenkosten inklusive?|Are the utilities included?","Wie hoch ist die Kaution?|How much is the deposit?","Ab wann ist die Wohnung frei?|From when is the flat available?","Darf ich ein Haustier haben?|May I keep a pet?","Ich bin sehr interessiert.|I'm very interested."],
 ask:["Was machen Sie beruflich?|What do you do for a living?|Ich bin Ingenieurin.","Rauchen Sie?|Do you smoke?|Nein, ich rauche nicht.","Wie viele Personen ziehen ein?|How many people will move in?|Nur ich und meine Katze."],
 tpl:{t:"Email: asking to view a flat",de:"Sehr geehrte Frau Becker,\n\nich habe Ihre Anzeige gelesen und interessiere mich sehr für die Wohnung in der Lindenstraße. Ich bin 29 Jahre alt, arbeite als Ingenieurin und suche eine ruhige Wohnung. Wann kann ich die Wohnung besichtigen?\n\nMit freundlichen Grüßen\nAlex Novak",en:"Dear Ms. Becker, I read your ad and I'm very interested in the flat on Lindenstraße. I'm 29, I work as an engineer and I'm looking for a quiet flat. When can I view the flat? Kind regards, Alex Novak"}},
{id:"vermieter",cat:"life",e:"🔧",h:15,lv:"A2",t:"Something is broken",de:"Ein Problem in der Wohnung",goal:"The heating is broken. Call your landlord.",roles:{A:"Landlord",B:"You"},
 d:["B|Guten Tag, Herr Krause, hier ist Alex Novak aus dem dritten Stock.|Hello Mr. Krause, this is Alex Novak from the third floor.","A|Guten Tag. Was gibt es?|Hello. What's up?","B|Die Heizung in meiner Wohnung funktioniert seit gestern nicht mehr.|The heating in my flat hasn't been working since yesterday.","A|Oh, das tut mir leid. Ist es sehr kalt?|Oh, I'm sorry. Is it very cold?","B|Ja, nur 15 Grad. Können Sie bitte einen Handwerker schicken?|Yes, only 15 degrees. Could you please send a tradesman?","A|Natürlich. Ich rufe sofort an. Sind Sie morgen Vormittag zu Hause?|Of course. I'll call right away. Are you at home tomorrow morning?","B|Ja, bis zwölf Uhr. Vielen Dank!|Yes, until twelve. Thank you very much!"],
 p:["Die Heizung funktioniert nicht.|The heating isn't working.","Das Wasser ist nicht warm.|The water isn't warm.","Können Sie bitte einen Handwerker schicken?|Could you please send a tradesman?","Wann kann der Handwerker kommen?|When can the tradesman come?","Ich bin morgen Vormittag zu Hause.|I'm at home tomorrow morning.","Das ist dringend.|It's urgent."],
 ask:["Seit wann ist das so?|Since when has it been like that?|Seit gestern Abend.","Wann sind Sie zu Hause?|When are you at home?|Morgen bis zwölf Uhr.","Haben Sie schon den Hausmeister gefragt?|Have you asked the caretaker yet?|Ja, aber er ist im Urlaub."],
 tpl:{t:"Email to your landlord",de:"Sehr geehrter Herr Krause,\n\nleider funktioniert die Heizung in meiner Wohnung seit gestern nicht mehr. Es ist sehr kalt. Könnten Sie bitte so schnell wie möglich einen Handwerker schicken? Ich bin morgen bis 12 Uhr zu Hause.\n\nVielen Dank und freundliche Grüße\nAlex Novak",en:"Dear Mr. Krause, unfortunately the heating in my flat hasn't worked since yesterday. It's very cold. Could you please send a tradesman as soon as possible? I'm at home tomorrow until 12. Thank you and kind regards, Alex Novak"}},

 d:["A|Liebes Team, das ist unsere neue Kollegin.|Dear team, this is our new colleague.","B|Hallo zusammen! Ich heiße Alex Novak und komme aus Polen.|Hello everyone! My name is Alex Novak and I come from Poland.","A|Alex arbeitet ab heute in der Entwicklung.|Alex works in development from today.","B|Genau. Ich bin Ingenieurin und arbeite mit Robotern.|Exactly. I'm an engineer and I work with robots.","A|Herzlich willkommen! Wenn Sie Fragen haben, fragen Sie einfach.|Welcome! If you have questions, just ask.","B|Danke! Mein Deutsch ist noch nicht perfekt. Bitte sprechen Sie etwas langsamer.|Thanks! My German isn't perfect yet. Please speak a bit more slowly.","A|Kein Problem. Wir duzen uns hier übrigens alle.|No problem. By the way, we all use “du” here.","B|Super, dann: Ich bin Alex!|Great, then: I'm Alex!"],
 p:["Hallo zusammen!|Hello everyone!","Ich arbeite ab heute in der Entwicklung.|I work in development from today.","Vorher habe ich in Breslau gearbeitet.|Before, I worked in Wrocław.","Mein Deutsch ist noch nicht perfekt.|My German isn't perfect yet.","Können Sie bitte langsamer sprechen?|Could you speak more slowly, please?","Ich freue mich auf die Zusammenarbeit.|I'm looking forward to working together."],

 d:["A|Morgen! Na, wie war dein Wochenende?|Morning! So, how was your weekend?","B|Sehr schön, danke! Ich war mit Freunden am Rhein. Und deins?|Very nice, thanks! I was at the Rhine with friends. And yours?","A|Ruhig. Ich habe viel gelesen. Möchtest du auch einen Kaffee?|Quiet. I read a lot. Would you like a coffee too?","B|Ja, gern. Mit Milch, ohne Zucker.|Yes, please. With milk, no sugar.","A|Hier, bitte. Hast du schon Pläne für den Urlaub?|Here you go. Do you have holiday plans yet?","B|Ja, im Sommer fliege ich nach Spanien. Ich freue mich schon sehr!|Yes, in summer I'm flying to Spain. I'm really looking forward to it!","A|Toll! Oh, ich muss los, mein Meeting fängt gleich an. Bis später!|Great! Oh, I have to go, my meeting is about to start. See you later!","B|Bis später!|See you later!"],
 p:["Wie war dein Wochenende?|How was your weekend?","Und deins?|And yours?","Möchtest du auch einen Kaffee?|Would you like a coffee too?","Mit Milch, ohne Zucker.|With milk, no sugar.","Hast du schon Pläne für den Urlaub?|Do you have holiday plans yet?","Ich muss los.|I have to go."],

{id:"meeting",cat:"work",e:"📊",h:230,lv:"A2",t:"In a meeting",de:"Im Meeting",goal:"Report on your project and ask when you don't understand.",roles:{A:"Team lead",B:"You"},
 d:["A|Okay, wie ist der Stand beim Projekt?|OK, what's the status of the project?","B|Wir sind fast fertig. Der Test läuft gut, aber wir haben noch ein Problem mit der Software.|We're almost done. The test is going well, but we still have a problem with the software.","A|Was für ein Problem?|What kind of problem?","B|Der Roboter stoppt manchmal ohne Grund. Wir suchen den Fehler.|The robot sometimes stops for no reason. We're looking for the bug.","A|Schaffen wir den Termin am Freitag?|Will we make the Friday deadline?","B|Ich glaube schon. Aber ich brauche Hilfe von Tom.|I think so. But I need help from Tom.","A|Tom ist diese Woche im Urlaub. Vielleicht kann Sara helfen.|Tom is on holiday this week. Maybe Sara can help.","B|Entschuldigung, das habe ich nicht ganz verstanden. Wer ist Sara?|Sorry, I didn't quite understand that. Who is Sara?","A|Sara ist neu im Software-Team. Ich schicke dir ihre E-Mail-Adresse.|Sara is new in the software team. I'll send you her email address."],
 p:["Wir sind fast fertig.|We're almost done.","Wir haben ein Problem mit der Software.|We have a problem with the software.","Ich glaube schon.|I think so.","Ich bin nicht sicher.|I'm not sure.","Das habe ich nicht ganz verstanden.|I didn't quite understand that.","Kannst du das bitte noch einmal erklären?|Can you explain that again, please?"],
 ask:["Wie ist der Stand?|What's the status?|Wir sind fast fertig.","Schaffst du das bis Freitag?|Can you manage it by Friday?|Ich glaube schon.","Brauchst du Hilfe?|Do you need help?|Ja, gern. Kannst du mir morgen helfen?"]},
{id:"problem",cat:"work",e:"🤖",h:280,lv:"A2",t:"A machine problem",de:"Ein technisches Problem",goal:"A machine isn't working. Describe the problem to a colleague.",roles:{A:"Colleague",B:"You"},
 d:["A|Hey, was ist los? Du siehst gestresst aus.|Hey, what's up? You look stressed.","B|Die Maschine in Halle 2 funktioniert nicht richtig.|The machine in hall 2 isn't working properly.","A|Was genau passiert?|What exactly happens?","B|Der Greifer öffnet sich nicht mehr, und auf dem Display steht eine Fehlermeldung.|The gripper doesn't open anymore, and there's an error message on the display.","A|Hast du die Maschine schon neu gestartet?|Have you restarted the machine yet?","B|Ja, zweimal. Leider hat das nichts geändert.|Yes, twice. Unfortunately that didn't change anything.","A|Dann ist vielleicht der Sensor kaputt. Ich komme gleich und schaue es mir an.|Then maybe the sensor is broken. I'll come right away and take a look.","B|Danke, das ist nett!|Thanks, that's kind!"],
 p:["Die Maschine funktioniert nicht richtig.|The machine isn't working properly.","Auf dem Display steht eine Fehlermeldung.|There's an error message on the display.","Ich habe sie schon neu gestartet.|I've already restarted it.","Vielleicht ist der Sensor kaputt.|Maybe the sensor is broken.","Kannst du dir das mal ansehen?|Can you take a look at it?","Seit heute Morgen geht es nicht mehr.|It hasn't worked since this morning."],
 ask:["Was genau ist das Problem?|What exactly is the problem?|Der Greifer öffnet sich nicht.","Seit wann ist das so?|Since when has it been like that?|Seit heute Morgen.","Hast du schon etwas versucht?|Have you tried anything yet?|Ja, ich habe die Maschine neu gestartet."]},
{id:"verschieben",cat:"work",e:"📅",h:175,lv:"A2",t:"Move a meeting",de:"Einen Termin verschieben",goal:"You can't make a meeting. Ask a colleague to move it.",roles:{A:"Colleague",B:"You"},
 d:["B|Hallo Sara, hier ist Alex. Hast du kurz Zeit?|Hi Sara, it's Alex. Do you have a minute?","A|Klar, was gibt's?|Sure, what's up?","B|Wir haben morgen um neun ein Meeting. Leider kann ich da nicht. Können wir den Termin verschieben?|We have a meeting tomorrow at nine. Unfortunately I can't make it. Can we move it?","A|Kein Problem. Passt es dir am Nachmittag?|No problem. Does the afternoon work for you?","B|Um zwei Uhr wäre super.|Two o'clock would be great.","A|Gut, dann um zwei Uhr in Raum 4. Ich schicke dir eine Einladung.|OK, then two o'clock in room 4. I'll send you an invitation.","B|Danke, Sara! Bis morgen.|Thanks, Sara! See you tomorrow."],
 p:["Hast du kurz Zeit?|Do you have a minute?","Leider kann ich morgen nicht.|Unfortunately I can't make it tomorrow.","Können wir den Termin verschieben?|Can we move the meeting?","Passt es dir am Nachmittag?|Does the afternoon work for you?","Um zwei Uhr wäre super.|Two o'clock would be great.","Ich schicke dir eine Einladung.|I'll send you an invitation."],
 ask:["Wann hast du Zeit?|When do you have time?|Morgen ab zwei Uhr.","Warum kannst du nicht?|Why can't you?|Ich habe einen Arzttermin.","Wo treffen wir uns?|Where shall we meet?|In Raum 4."],
 tpl:{t:"Email: moving a meeting",de:"Hallo Sara,\n\nleider kann ich morgen um 9 Uhr nicht am Meeting teilnehmen. Können wir den Termin auf 14 Uhr verschieben? Raum 4 ist um diese Zeit frei.\n\nDanke und viele Grüße\nAlex",en:"Hi Sara, unfortunately I can't attend the meeting tomorrow at 9. Can we move it to 2 pm? Room 4 is free at that time. Thanks and best regards, Alex"}},
{id:"krank",cat:"work",e:"🤒",h:350,lv:"A2",t:"Calling in sick",de:"Sich krankmelden",goal:"You're sick. Call your boss before work.",roles:{A:"Boss",B:"You"},
 d:["B|Guten Morgen, Frau Weber. Hier ist Alex.|Good morning, Ms. Weber. This is Alex.","A|Guten Morgen, Alex. Was ist los?|Good morning, Alex. What's wrong?","B|Ich bin leider krank. Ich habe Fieber und kann heute nicht zur Arbeit kommen.|Unfortunately I'm sick. I have a fever and can't come to work today.","A|Oh, das tut mir leid. Gehen Sie zum Arzt?|Oh, I'm sorry. Are you going to the doctor?","B|Ja, ich habe um zehn Uhr einen Termin. Ich schicke Ihnen dann die Krankmeldung.|Yes, I have an appointment at ten. I'll send you the sick note afterwards.","A|Gut. Ruhen Sie sich aus. Gute Besserung!|OK. Get some rest. Get well soon!","B|Danke. Mein Kollege Tom kann das Meeting um elf Uhr übernehmen.|Thanks. My colleague Tom can take over the meeting at eleven."],
 p:["Ich bin leider krank.|Unfortunately I'm sick.","Ich kann heute nicht zur Arbeit kommen.|I can't come to work today.","Ich gehe heute zum Arzt.|I'm going to the doctor today.","Ich schicke Ihnen die Krankmeldung.|I'll send you the sick note.","Ich bin bis Freitag krankgeschrieben.|I'm on sick leave until Friday.","Ab Montag bin ich wieder da.|I'll be back on Monday."],
 ask:["Wie lange sind Sie krank?|How long will you be off sick?|Wahrscheinlich bis Mittwoch.","Wer kann Ihre Aufgaben übernehmen?|Who can take over your tasks?|Mein Kollege Tom.","Haben Sie schon einen Arzttermin?|Do you already have a doctor's appointment?|Ja, heute um zehn Uhr."],
 tpl:{t:"Email: calling in sick",de:"Liebe Frau Weber,\n\nleider bin ich krank und kann heute nicht zur Arbeit kommen. Ich gehe heute zum Arzt und schicke Ihnen die Krankmeldung so schnell wie möglich. Tom übernimmt das Meeting um 11 Uhr.\n\nViele Grüße\nAlex",en:"Dear Ms. Weber, unfortunately I'm sick and can't come to work today. I'm going to the doctor today and will send you the sick note as soon as possible. Tom will take over the 11 o'clock meeting. Best regards, Alex"}}
];

var GRAMMAR=[
{id:"a1-verbs",ch:"A1-1",t:"Verbs in the present tense",

 tbl:T(["ich|lern<b>e</b>","du|lern<b>st</b>","er / sie / es|lern<b>t</b>","wir|lern<b>en</b>","ihr|lern<b>t</b>","sie / Sie|lern<b>en</b>"]),

 g:function(){return genVerbIn(["lernen","arbeiten","wohnen","machen","spielen","kaufen","kochen","hören","fragen","trinken","suchen","warten","öffnen","besuchen","bestellen","gehen","kommen"])}},
{id:"a1-wfrage",ch:"A1-1",t:"W-questions and statements",
 rule:"In a statement and in a W-question the conjugated verb is always in <b>position 2</b>. W-words: <b>wer, was, wo, woher, wohin, wann, wie, warum</b>.",
 ex:T(["Ich komme aus der Türkei.|I come from Turkey.","Woher kommst du?|Where are you from?","Was machst du heute?|What are you doing today?"]),
 g:function(){return Math.random()<0.6?genQW():genOrder()}},
{id:"a1-irreg",ch:"A1-2",t:"Verbs with a vowel change",
